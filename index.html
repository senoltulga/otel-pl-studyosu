function refreshLive(){
  if(!L.on||!L.id)return;
  const x=ctx(),n=getNode(L.id,x);if(!n||!n.live)return;x.ms=L.m;
  const e=$q('#lpLive');if(e){e.classList.add('noanim');e.innerHTML=tokHtml(n.live(x));}
  const tn=tuneOf(L.id,x);if(tn&&L.tune)updLab(tn,false);
}

/* ---------- Dene (oyun alanı) ---------- */
const METR=[['Oda geliri',c=>sum(c.roomRev)],['Toplam gelir',c=>sum(c.rev)],['GOP',c=>sum(c.gop)],['NOI (rezerv öncesi)',c=>sum(c.ebitda)],['NOI (rezerv sonrası)',c=>sum(c.noi)]];
function labHtml(tn){
  L.tune={v:tn.cur,scope:L.scope};
  return '<div class="lp-lab" id="lab"><h4 style="margin:0">Dene · yıllık etki</h4><p class="hint" style="margin:0">Değeri kaydırın. Gerçek projeniz değişmez.</p>'+
   '<div class="lab-row"><input type="range" id="labR" min="'+tn.min+'" max="'+tn.max+'" step="'+tn.step+'" value="'+tn.cur+'" aria-label="'+esc(tn.label)+'"><input type="number" id="labN" min="'+tn.min+'" max="'+tn.max+'" step="'+tn.step+'" value="'+tn.cur+'" aria-label="Deneme değeri"><span class="unit">'+esc(tn.unit||'')+'</span></div>'+
   (tn.scopeable?'<div class="lp-scope" style="display:flex;gap:6px"><button data-scope="month" aria-pressed="'+(L.scope==='month')+'">Sadece '+(L.m==null?MONTHS[DEF_M]:MONTHS[L.m])+'</button><button data-scope="all" aria-pressed="'+(L.scope==='all')+'">Tüm aylar</button></div>':'')+
   '<table class="lab-t"><thead><tr><th>'+CUR()+', yıllık</th><th>Şimdi</th><th>Dene</th><th>Fark</th></tr></thead><tbody>'+
   METR.map((m,i)=>'<tr><td>'+m[0]+'<div class="lab-bar"><i class="n" id="lbn'+i+'"></i></div><div class="lab-bar"><i id="lbt'+i+'"></i></div></td><td class="n" id="lnow'+i+'"></td><td class="n" id="ltry'+i+'"></td><td class="n" id="ldif'+i+'"></td></tr>').join('')+
   '</tbody></table><div><button class="btn small" data-act="resetLab">Sıfırla</button></div></div>';
}
function tw(el,to,f,instant){
  if(!el)return;const from=el._v==null?to:el._v;el._v=to;
  if(instant||from===to||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=f(to);return;}
  cancelAnimationFrame(el._r);const t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);el.textContent=f(from+(to-from)*e);if(k<1)el._r=requestAnimationFrame(step);};
  el._r=requestAnimationFrame(step);
}
const fd=v=>{const r=Math.round(v);return r===0?'–':(r>0?'+':'−')+nf.format(Math.abs(r));};
function updLab(tn,anim){
  const p=P(),base=compute(p),q=JSON.parse(JSON.stringify(p));
  tn.apply(q,L.tune.v,L.scope);
  const t=compute(q);
  const vals=METR.map(m=>[m[1](base),m[1](t)]);
  const mx=Math.max(...vals.flat().map(Math.abs),1);
  vals.forEach((v,i)=>{
    tw($q('#lnow'+i),v[0],fmt,!anim&&true);tw($q('#ltry'+i),v[1],fmt,!anim&&!L.labInit);
    const df=$q('#ldif'+i);if(df){const dv=v[1]-v[0];df._v=null;df.textContent=fd(dv);df.className='n '+(Math.round(dv)>0?'dpos':Math.round(dv)<0?'dneg':'');}
    const a=$q('#lbn'+i),b=$q('#lbt'+i);
    // her iki çubuk toplam gelire göre ölçeklenir
    if(a)a.style.width=Math.max(0,v[0]/mx*100)+'%';if(b)b.style.width=Math.max(0,v[1]/mx*100)+'%';
  });
}
function initLab(tn){
  L.labInit=true;updLab(tn,false);
  const range=$q('#labR'),num=$q('#labN');
  const set=v=>{v=Math.min(tn.max,Math.max(tn.min,v));L.tune.v=v;range.value=v;if(document.activeElement!==num)num.value=v;L.labInit=false;updLab(tn,true);};
  range.addEventListener('input',()=>set(parseFloat(range.value)));
  num.addEventListener('input',()=>{const v=parseFloat(num.value.replace(',','.'));if(isFinite(v)){L.tune.v=Math.min(tn.max,Math.max(tn.min,v));range.value=L.tune.v;L.labInit=false;updLab(tn,true);}});
}

/* ---------- Seçim, çözümleme ---------- */
function select(id,m,keepM){
  if(L.id!==id){L.scope='month';L.userY=false;}
  const prev=L.id+'|'+L.m;
  L.id=id;
  if(m!==undefined)L.m=m;else if(!keepM)L.m=null;
  const n=getNode(id,ctx());
  if(L.m==null&&n&&n.monthly)L.m=DEF_M;
  paint();applyHL(true);
}
function resolve(t){
  if(!t||!t.closest||t.closest('#lp')||t.closest('#learnBtn'))return null;
  const p=P();
  {const ln=t.closest('[data-ln]'),ck=t.closest('[data-click]');if(ln&&ln.dataset.ln&&!(ck&&ck.dataset.click.indexOf('tab:')!==0))return {id:ln.dataset.ln};}
  let el=t.closest('[data-in],[data-change]');
  if(el){const k=el.dataset.in||el.dataset.change;const [a,b,c]=k.split(':');
    switch(a){
      case 'name':return {id:'name'};
      case 'rooms':case 'guests':case 'ffe':return {id:a};
      case 'days':case 'occ':case 'adr':case 'open':return {id:a,m:+b};
      case 'lname':case 'lval':return {id:'line:'+b};
      case 'lmon':return {id:'line:'+b,m:+c};
      case 'ldrv':{const l=p.lines.find(l=>l.id===b);return {id:'drv:'+(l?l.driver:'fixed')};}
      case 'lstaff':return {id:'staff'};
    }}
  el=t.closest('[data-click]');
  if(el){const a=el.dataset.click.split(':')[0];if(a==='tab')return null;return {id:'btn:'+a,block:true};}
  if(t.closest('#projSel'))return {id:'proj'};
  const sc=t.closest('#strip>div');
  if(sc){const i=Array.prototype.indexOf.call(sc.parentNode.children,sc);return {id:['rev','gop','ebitda','noi','occKPI'][i]};}
  const kp=t.closest('.kpi');
  if(kp){const lb=kp.querySelector('small').textContent;const k=Object.keys(KPI_LBL).find(k=>KPI_LBL[k]===lb);return k?{id:k}:null;}
  const td=t.closest('td,th');
  if(!td)return null;
  if(td.id){
    let mm=td.id.match(/^g-(sold|rrev|cap)-(\d+|t)$/);
    if(mm)return {id:mm[1],m:mm[2]==='t'?null:+mm[2]};
    mm=td.id.match(/^la-(.+)$/);if(mm)return {id:'line:'+mm[1]};
    mm=td.id.match(/^gt-(.+)$/);if(mm)return {id:'grp:'+mm[1]};
    mm=td.id.match(/^g-(days|occ|adr)-t$/);if(mm)return {id:mm[1],m:null};
  }
  const tr=td.closest('tr');
  if(td.closest('table.pl')){
    const row=plRows().find(r=>r.tr===tr);
    if(row&&row.keys.length){const ci=td.cellIndex;return {id:row.keys[0],m:ci>=1&&ci<=12?ci-1:null};}
    return null;
  }
  if(tr&&tr.classList.contains('gh')){const g=GROUPS.find(g=>g.name===tr.cells[0].textContent.trim());if(g)return {id:'grp:'+g.id};}
  if(S.tab==='kpi'&&td.closest('table')){
    const th=td.closest('table').tHead.rows[0].cells[td.cellIndex];const txt=th?th.textContent.trim().replace(/^ADR \(.*\)$/,'ADR'):'';
    const map={'Doluluk':'occKPI','ADR':'adrKPI','RevPAR':'revpar','TRevPAR':'trevpar','GOPPAR':'goppar','GOP marjı':'gopm','Personel / gelir':'staffpct'};
    const mi=MONTHS.indexOf(tr.cells[0].textContent.trim());
    if(map[txt])return {id:map[txt],m:mi>=0?mi:null};
  }
  if(S.tab==='girdiler'&&td.closest('table')){
    const th=td.closest('table').tHead.rows[0].cells[td.cellIndex];const txt=th?th.textContent.trim().replace(/^ADR \(.*\)$/,'ADR'):'';
    const map={'Gün':'days','Açık oda':'open','Kapasite':'cap','Doluluk %':'occ','ADR':'adr','Satılan oda':'sold','Oda geliri':'rrev'};
    const mi=MONTHS.indexOf(tr.cells[0].textContent.trim());
    if(map[txt])return {id:map[txt],m:mi>=0?mi:null};
  }
  return null;
}

/* ---------- Olaylar ---------- */
function setOn(v){
  L.on=v;document.body.classList.toggle('learn',v);
  const b=$q('#learnBtn');b.setAttribute('aria-pressed',v);b.textContent=v?'Öğren: açık':'Öğren';
  if(!v){clearHL();L.id=null;}
  paint();applyHL(true);
}
(function injectBtn(){
  const b=document.createElement('button');b.className='btn';b.id='learnBtn';b.setAttribute('aria-pressed','false');b.textContent='Öğren';
  b.title='Alanlara tıklayıp formüllerini ve etkilerini görün';
  const pr=$q('.proj');pr.insertBefore(b,pr.firstChild);
  b.addEventListener('click',()=>setOn(!L.on));
})();
document.addEventListener('click',e=>{
  if(!L.on)return;
  if(e.target.closest&&e.target.closest('#lp')||e.target.closest&&e.target.closest('#learnBtn'))return;
  const r=resolve(e.target);
  if(!r)return;
  if(r.block){e.preventDefault();e.stopImmediatePropagation();}
  if(!r.id)return;
  if(L.fs&&L.fs.id===r.id&&performance.now()-L.fs.t<600){L.fs=null;return;}
  select(r.id,r.m===undefined?null:r.m,false);
},true);
document.addEventListener('focusin',e=>{
  if(!L.on||(e.target.closest&&e.target.closest('#lp')))return;
  const r=resolve(e.target);if(!r||r.block||!r.id)return;
  const nm=r.m===undefined?null:r.m;
  if(L.id===r.id&&L.m===nm)return;
  L.fs={id:r.id,t:performance.now()};
  select(r.id,nm,false);
});
document.addEventListener('input',e=>{
  if(!L.on||(e.target.closest&&e.target.closest('#lp')))return;
  refreshLive();
});
lp.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){select(b.dataset.go,undefined,true);return;}
  if(b.dataset.m!==undefined){L.m=b.dataset.m==='y'?null:+b.dataset.m;paint();applyHL(true);return;}
  if(b.dataset.scope){L.scope=b.dataset.scope;paint();return;}
  switch(b.dataset.act){
    case 'close':L.id=null;paint();clearHL();break;
    case 'off':setOn(false);break;
    case 'show':{const n=getNode(L.id,ctx());if(n&&n.tab){if(n.tab==='kalemler'){const p=P();let g=null;if(L.id.indexOf('line:')===0){const l=p.lines.find(z=>z.id===L.id.slice(5));g=l&&l.group;}else if(L.id.indexOf('grp:')===0)g=L.id.slice(4);else if(L.id.indexOf('drv:')===0){const l=p.lines.find(z=>z.driver===L.id.slice(4));g=l&&l.group;}else if(L.id==='rrev'||L.id==='gn'||L.id==='sold')g=(L.id==='rrev')?'rev_room':null;if(g){const gg=GROUPS.find(z=>z.id===g);if(gg)S.ksec=gg.sec==='rev'?'gelir':'gider';}else if(L.id==='gn'||L.id==='sold')S.ksec='gider';}setTab(n.tab);}break;}
    case 'resetLab':{const tn=tuneOf(L.id,ctx());if(tn){paint();applyHL(false);}break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&L.on&&L.id){L.id=null;paint();clearHL();}});

/* motor sekmeyi veya listeyi yeniden çizince vurguyu geri koy */
const mo1=new MutationObserver(()=>{if(L.on&&L.id){clearTimeout(mo1._t);mo1._t=setTimeout(()=>{paint();applyHL(false);},30);}});
mo1.observe($q('#view'),{childList:true});
const mo2=new MutationObserver(()=>{if(L.on&&L.id){clearTimeout(mo2._t);mo2._t=setTimeout(()=>applyHL(false),30);}});
mo2.observe($q('#strip'),{childList:true});
})();
</script>

<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style></head><body><title>Otel P&L Stüdyosu v11</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Düzen: üstte proje çubuğu ve canlı özet, altında sekmeler (Girdiler, Kalemler, P&L, KPI). Sayılar mono, etiketler sans. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --ink:#12232B; --muted:#58696F; --line:#DCE3E6; --line-soft:#EBF0F2;
  --accent:#0B6E6A; --accent-ink:#FFFFFF; --accent-soft:#E0F0EE; --input:#FBFCFC;
  --good:#1B7F4B; --bad:#B3261E; --key:#EAF3F2;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1F; --surface:#15262C; --ink:#E4EEF0; --muted:#8CA2AA; --line:#25393F; --line-soft:#1D3036;
    --accent:#4FC3BB; --accent-ink:#06201F; --accent-soft:#17393A; --input:#112126;
    --good:#5CC98A; --bad:#FF8F85; --key:#183037; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --surface:#15262C; --ink:#E4EEF0; --muted:#8CA2AA; --line:#25393F; --line-soft:#1D3036;
  --accent:#4FC3BB; --accent-ink:#06201F; --accent-soft:#17393A; --input:#112126;
  --good:#5CC98A; --bad:#FF8F85; --key:#183037; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand span{color:var(--muted);font-size:12px}
.proj{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.proj select{min-width:200px;max-width:100%}
select,input[type=text],input[type=number],textarea{background:var(--input);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{font-family:var(--mono);text-align:right;width:100%}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.strip>div{background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.strip b{font-family:var(--mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.strip em{font-style:normal;color:var(--muted);font-size:12px;font-family:var(--mono)}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;font-weight:500;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h2{font-size:14px;margin:0 0 12px;font-weight:600}
.panel h3{font-size:12px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.grid2{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.fields{display:grid;grid-template-columns:1fr 110px;gap:8px 12px;align-items:center}
.fields label{color:var(--muted)}
.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{color:var(--muted);font-size:12px}
.fld input{width:100%}
.fld small{color:var(--muted);font-size:11px}
.hint{color:var(--muted);font-size:12px;margin:8px 0 0}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px;background:var(--surface)}
th.n,td.n{text-align:right}
td input[type=number]{width:72px}
td input[type=text]{width:100%;min-width:180px}
.tot td{font-weight:600}

/* Kalemler */
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px}
.sec-title:first-child{margin-top:0}
.sec-title h3{margin:0}
.gh td{background:var(--key);font-weight:600;border-bottom:1px solid var(--line)}
.mrow td{background:var(--input)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.mgrid label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.unit{color:var(--muted);font-size:12px;margin-left:4px}

/* P&L */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.ksec{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ksec button{flex:1 1 220px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-align:left}
.ksec button small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.ksec button b{font-family:var(--mono);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.ksec button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.ksec button[aria-pressed=true] small{color:var(--accent)}
.pl th:first-child,.pl td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:260px;max-width:340px;white-space:normal}
.pl thead th{position:sticky;top:0}
.pl tr.d0 td{font-weight:600}
.pl tr.key td{background:var(--key);font-weight:600;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pl tr.key td:first-child{background:var(--key)}
.pl tr.d2 td,.pl tr.d3 td{color:var(--muted)}
.pl .chev{width:18px;height:18px;border:0;background:none;color:var(--muted);padding:0;margin-right:4px;transition:transform .15s}
.pl .chev[aria-expanded=true]{transform:rotate(90deg)}
.pl .sp{display:inline-block;width:22px}
.neg{color:var(--bad)}
small.mut{color:var(--muted)}
.refs{margin:12px 0 0;padding-left:18px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}.refs b{color:var(--ink)}.refs a{color:var(--accent)}
.chart .dcfb{fill:var(--accent)}.chart .dcft{fill:var(--good)}
.sens th{font-weight:600}.sens td.cen{background:var(--key);font-weight:600}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13px}label.chk input{width:auto}
.proj #curSel{width:76px;min-width:76px;flex:none}
select.cur{width:auto;padding:3px 4px;font-size:12px;font-family:var(--mono);margin-left:4px}
.inrow{display:flex;gap:6px;align-items:center}.inrow input{flex:1}.curbig{font-family:var(--mono);font-size:22px;color:var(--accent)}
.pbform{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.pbt td,.pbt th{white-space:nowrap}.pbt tr.key td{background:var(--key);font-weight:600}
.chart .pbn{fill:var(--bad)}.chart .pbp{fill:var(--good)}
.rowh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12px;margin:10px 0 0}
#view>.panel+#pb-out,#pb-out{display:flex;flex-direction:column;gap:16px;margin-top:16px}
@media (prefers-reduced-motion:reduce){.pl .chev{transition:none}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;color:var(--muted);font-size:12px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b1{fill:var(--accent)}
.chart .b2{fill:var(--good)}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12px;margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:11px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}

.savest{font-size:12px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savest.ok{color:var(--good)}.savest.dirty{color:var(--bad)}
.dlg{position:fixed;inset:0;background:rgba(10,20,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:30;overflow:auto}
.dlg[hidden]{display:none}
.dbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px}
.dbox.wide{width:min(640px,100%)}
.dbox h2{margin:0;font-size:16px}.dbox h3{margin:6px 0 0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.dbox input[type=text]{width:100%}
.rad{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink)}
.drow{display:flex;gap:8px;flex-wrap:wrap}
.lrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.lrow small{display:block;color:var(--muted);font-size:11px}
.kil{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.kside{display:flex;flex-direction:column;gap:2px;position:sticky;top:8px}
.kn{text-align:left;background:transparent;border:0;border-radius:6px;padding:7px 10px;color:var(--ink)}
.kn:hover{background:var(--line-soft)}.kn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.kbody{line-height:1.55}.kbody .kh{font-size:20px;margin:0 0 10px;font-weight:600}
.kbody h3{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:18px 0 6px;font-weight:600}
.kbody p,.kbody li{font-size:14px}.kbody ul,.kbody ol{padding-left:20px;margin:6px 0}
.kbody .tw{overflow-x:auto;margin:8px 0}
.kbody th,.kbody td{white-space:normal}
.kpn{display:flex;justify-content:space-between;margin-top:20px;gap:8px}
@media (max-width:720px){.kil{grid-template-columns:1fr}.kside{position:static;flex-direction:row;flex-wrap:wrap}}


.mobonly{display:none}
.proj{align-items:center}.acct{margin-left:auto;display:flex;gap:8px;align-items:center}
body.locked .wrap{display:none}.dlg.lock{background:var(--bg,#f4f6f6);align-items:center}
@media (max-width:640px){
  .wrap{gap:12px}
  .brand h1{font-size:20px}.brand span{display:none}
  header.top{gap:8px}
  .proj{gap:6px;width:100%}
  .proj select{min-width:0;flex:1 1 150px}
  .proj .btn{min-height:38px;padding:6px 10px;font-size:13px}
  .proj .btn.small{min-height:34px}
  .proj .savest{flex:1 1 100%;order:5;max-width:none}
  #acct{display:flex;gap:6px;align-items:center;max-width:100%}
  .strip{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;border-radius:8px}
  .strip>div{flex:0 0 150px;scroll-snap-align:start;padding:8px 12px}
  .strip b{font-size:17px}
  .tabs{overflow-x:auto;scrollbar-width:none}
  .tabs button{min-height:40px;white-space:nowrap}
  .panel{padding:12px}
  .kside{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:4px}
  .kn{white-space:nowrap;border:1px solid var(--line);min-height:38px}
  .kbody .kh{font-size:18px}
  .dlg{padding:3vh 10px}
  .dbox{padding:14px}
  .dbox .btn{min-height:40px}
  body:not(.mshow) table.pl th:nth-child(n+2):nth-child(-n+13),body:not(.mshow) table.pl td:nth-child(n+2):nth-child(-n+13){display:none}
  body:not(.mshow) table.pl th:nth-child(15),body:not(.mshow) table.pl td:nth-child(15){display:none}
  .pl th:first-child,.pl td:first-child{min-width:150px;max-width:190px;font-size:13px}
  th,td{padding:5px 6px}
  .mobonly{display:inline-block}
}

.osub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.osub button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;min-height:34px}
.osub button.on{background:var(--accent);border-color:var(--accent);color:#fff}.osub button:disabled{opacity:.5}
details summary{cursor:pointer;font-size:13px;color:var(--accent)}
.tor{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.torow{display:grid;grid-template-columns:240px 1fr;gap:10px;align-items:center}
.tonm{font-size:13px}.tobx{position:relative;height:26px}
.tobx u{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.tobar{position:absolute;top:4px;bottom:4px;border-radius:3px}.tobar.l{right:50%}.tobar.r{left:50%}
.tobar.dn{background:var(--muted);opacity:.7}.tobar.up{background:var(--accent)}
.toval{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
@media (max-width:640px){.mh{display:none}.otab td:first-child,.otab th:first-child{white-space:normal;min-width:120px;max-width:140px}.torow{grid-template-columns:1fr;gap:2px}.tonm{font-weight:500}}
.ow{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.ow.ok{color:var(--good);border-color:var(--good)}.ow.bad{color:var(--bad);border-color:var(--bad)}
.pbt tr.mut td{color:var(--muted)}
.pbt td.wr{white-space:normal}
@media (max-width:640px){.pbt td.wr{min-width:150px;font-size:12px}}
.pft td input[type=text]{min-width:190px}.pft td{vertical-align:middle}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><h1>Otel P&amp;L Stüdyosu</h1><span>Doluluk, ADR ve katsayılardan P&amp;L, GOP, NOI ve KPI. Tek yıllık bütçe, prototip. Sürüm 11.</span></div>
    <div class="proj">
      <select id="curSel" data-ln="cur:base" aria-label="Ana para birimi" title="Ana para birimi: tüm sonuçlar bu birimde"><option>USD</option><option>EUR</option><option>TL</option></select>
      <select id="projSel" aria-label="Proje"></select>
      <span id="saveSt" class="savest none" aria-live="polite"></span>
      <button class="btn" data-click="openDlg">Aç</button>
      <button class="btn primary" data-click="saveProj">Kaydet</button>
      <button class="btn" data-click="saveAs">Farklı kaydet</button>

<script>
/* ---------- Sabitler ---------- */
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const M3=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const GROUPS=[
 {id:'rev_room',name:'Oda geliri',sec:'rev'},{id:'rev_fb',name:'F&B geliri',sec:'rev'},{id:'rev_oth',name:'Diğer gelirler',sec:'rev'},
 {id:'dx_room',name:'Oda departmanı',sec:'dept'},{id:'dx_fb',name:'F&B departmanı',sec:'dept'},{id:'dx_oth',name:'Diğer departmanlar',sec:'dept'},
 {id:'ag',name:'İdari ve genel (A&G)',sec:'und'},{id:'its',name:'Bilgi ve telekom (ITS)',sec:'und'},{id:'sm',name:'Satış ve pazarlama',sec:'und'},
 {id:'pom',name:'Mülk işletme ve bakım (POM)',sec:'und'},{id:'util',name:'Enerji',sec:'und'},
 {id:'fees',name:'Franchise ve yönetim ücretleri',sec:'fees'},{id:'fixed',name:'Sabit giderler',sec:'fixed'}
];
const SEC_NAMES={rev:'Gelirler',dept:'Departman giderleri',und:'Dağıtılmamış giderler',fees:'İşletme ücretleri',fixed:'Sabit giderler'};
const DRIVERS={
 roomrev:{n:'Satılan oda × ADR',u:''},perGuest:{n:'Misafir-gecesi başına',u:'/ misafir-gecesi'},perRoom:{n:'Satılan oda başına',u:'/ satılan oda'},
 pctRoomRev:{n:'Oda gelirinin yüzdesi',u:'%'},pctTotalRev:{n:'Toplam gelirin yüzdesi',u:'%'},fixed:{n:'Aylık sabit tutar',u:'/ ay'}
};
const gname=id=>GROUPS.find(g=>g.id===id).name;

/* Excel dosyasındaki katsayılardan şablon: [grup, ad, sürücü, değer, personel?] */
const TEMPLATE=[
 ['rev_room','Oda geliri','roomrev',0],

  if(/Password should/i.test(m))return 'Şifre en az 6 karakter olmalı.';
  return m;};

/* ---------- Hesap ---------- */
const openOf=(p,i)=>(p.open&&p.open[i]!=null)?p.open[i]:p.rooms;
const z=()=>Array(12).fill(0);
const add=(...a)=>a.reduce((x,y)=>x.map((v,i)=>v+y[i]),z());
const sub=(a,b)=>a.map((v,i)=>v-b[i]);
const sum=a=>a.reduce((x,y)=>x+y,0);
function compute(p){
  const avail=z(),sold=z(),gn=z(),roomRev=z();const ar=rateOf(p,adrCurOf(p));
  for(let i=0;i<12;i++){avail[i]=openOf(p,i)*p.days[i];sold[i]=avail[i]*p.occ[i]/100;gn[i]=sold[i]*p.guests;roomRev[i]=sold[i]*p.adr[i]*ar;}
  const amt=(l,i,tr)=>{
    const lr=lineRate(p,l);
    if(l.monthly)return (+l.monthly[i]||0)*lr;
    const v=(+l.value||0)*lr;
    switch(l.driver){
      case 'roomrev':return roomRev[i];
      case 'perGuest':return v*gn[i];
      case 'perRoom':return v*sold[i];
      case 'pctRoomRev':return v/100*roomRev[i];
      case 'pctTotalRev':return v/100*tr;
      case 'fixed':return v;
    } return 0;
  };
  const line={},group={};
  const secOf=g=>GROUPS.find(x=>x.id===g).sec;
  const run=(sec,tr)=>{
    GROUPS.filter(g=>g.sec===sec).forEach(g=>{
      const ls=p.lines.filter(l=>l.group===g.id);
      ls.forEach(l=>{line[l.id]=Array.from({length:12},(_,i)=>amt(l,i,tr?tr[i]:0));});
      group[g.id]=add(z(),...ls.map(l=>line[l.id]));
    });
  };
  run('rev',null);
  const rev=add(group.rev_room,group.rev_fb,group.rev_oth);
  ['dept','und','fees','fixed'].forEach(s=>run(s,rev));
  const dept=add(group.dx_room,group.dx_fb,group.dx_oth);
  const deptProfit=sub(rev,dept);
  const dp={room:sub(group.rev_room,group.dx_room),fb:sub(group.rev_fb,group.dx_fb),oth:sub(group.rev_oth,group.dx_oth)};
  const und=add(group.ag,group.its,group.sm,group.pom,group.util);
  const gop=sub(deptProfit,und);
  const fees=group.fees;
  const icfc=sub(gop,fees);
  const fixed=group.fixed;
  const ebitda=sub(icfc,fixed);
  const ffe=rev.map(v=>v*p.ffe/100);
  const noi=sub(ebitda,ffe);
  const staff=add(z(),...p.lines.filter(l=>l.staff).map(l=>line[l.id]||z()));
  return {avail,sold,gn,roomRev,line,group,rev,dept,deptProfit,dp,und,gop,fees,icfc,fixed,ebitda,ffe,noi,staff};
}

/* ---------- Sekme: P&L ---------- */
function buildTree(p,c){
  const lines=g=>p.lines.filter(l=>l.group===g).map(l=>({key:'l'+l.id,label:l.name,v:c.line[l.id]}));
  const grp=g=>({key:'g'+g,label:gname(g),v:c.group[g],children:lines(g)});
  return [
   {key:'rev',label:'Toplam gelir',v:c.rev,top:1,children:['rev_room','rev_fb','rev_oth'].map(grp)},
   {key:'dx',label:'Departman giderleri',v:c.dept,top:1,children:['dx_room','dx_fb','dx_oth'].map(grp)},
   {key:'dp',label:'Departman kârı',v:c.deptProfit,top:1,children:[
      {key:'dp1',label:'Oda departman kârı',v:c.dp.room},{key:'dp2',label:'F&B departman kârı',v:c.dp.fb},{key:'dp3',label:'Diğer departman kârı',v:c.dp.oth}]},
   {key:'und',label:'Dağıtılmamış giderler',v:c.und,top:1,children:['ag','its','sm','pom','util'].map(grp)},
   {key:'gop',label:'GOP (brüt işletme kârı)',v:c.gop,key_:1},
   {key:'fees',label:'Franchise ve yönetim ücretleri',v:c.fees,top:1,children:lines('fees')},
   {key:'icfc',label:'Sabit giderler öncesi gelir',v:c.icfc,top:1},
   {key:'fixed',label:'Sabit giderler',v:c.fixed,top:1,children:lines('fixed')},
   {key:'ebitda',label:'NOI (FF&E rezervi öncesi)',v:c.ebitda,key_:1},
   {key:'ffe',label:`FF&E rezervi (%${p.ffe})`,v:c.ffe,top:1},
   {key:'noi',label:'NOI (FF&E rezervi sonrası)',v:c.noi,key_:1}
  ];
}
function expandedFor(level,tree){
  const s=new Set();
  const walk=(n,d)=>{if(n.children&&n.children.length){if(level>=3||(level===2&&d===0))s.add(n.key);n.children.forEach(ch=>walk(ch,d+1));}};
  tree.forEach(n=>walk(n,0));
  return s;
}
function plRows(tree,ex,R){
  let out='';
  const walk=(n,d)=>{
    const has=n.children&&n.children.length;
    const cls=['d'+Math.min(d,3)];if(n.key_)cls.push('key');
    const open=ex.has(n.key);
    const tot=sum(n.v);
    const lead=has?`<button class="chev" data-click="tg:${n.key}" aria-expanded="${open}" aria-label="Aç / kapat">▸</button>`:'<span class="sp"></span>';
    out+=`<tr class="${cls.join(' ')}"><td style="padding-left:${8+d*16}px">${lead}${esc(n.label)}</td>`+
      n.v.map(v=>`<td class="n ${v<-0.5?'neg':''}">${fmt(v)}</td>`).join('')+
      `<td class="n ${tot<-0.5?'neg':''}"><b>${fmt(tot)}</b></td><td class="n">${R?pct(tot/R):''}</td></tr>`;
    if(has&&open)n.children.forEach(ch=>walk(ch,d+1));
  };
  tree.forEach(n=>walk(n,0));
  return out;
}
function viewPL(){
  const p=P(),c=compute(p),R=sum(c.rev),tree=buildTree(p,c);
  if(!S.expanded)S.expanded=expandedFor(S.plLevel,tree);

    <div class="scroll"><table class="pl"><thead><tr><th>${CUR()}</th>${M3.map(m=>`<th class="n">${m}</th>`).join('')}<th class="n">Yıllık</th><th class="n">% gelir</th></tr></thead>
    <tbody>${plRows(tree,S.expanded,R)}</tbody></table></div>
    <p class="hint">Düzey 1: ana toplamlar. Düzey 2: grup toplamları. Düzey 3: tüm kalemler. Satırların yanındaki oklarla tek tek açabilirsiniz.</p></div>`;

function plTSV(){
  const p=P(),c=compute(p),R=sum(c.rev),tree=buildTree(p,c);
  const ex=expandedFor(3,tree);const rows=[[CUR(),...M3,'Yıllık','% gelir'].join('\t')];
  const walk=(n,d)=>{rows.push(['  '.repeat(d)+n.label,...n.v.map(v=>Math.round(v)),Math.round(sum(n.v)),(sum(n.v)/R*100).toFixed(1)].join('\t'));if(n.children&&ex.has(n.key))n.children.forEach(ch=>walk(ch,d+1));};
  tree.forEach(n=>walk(n,0));return rows.join('\n');
}

/* ---------- Sekme: KPI ---------- */
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v||1)));const f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e;}
function chartSVG(c){
  const W=900,H=300,L=56,Rr=12,T=14,B=28,iw=W-L-Rr,ih=H-T-B;
  const mx=niceMax(Math.max(...c.rev,1)),steps=4;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Aylık gelir ve GOP">`;
  for(let i=0;i<=steps;i++){const y=T+ih-ih*i/steps;s+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${nf.format(mx*i/steps/1000)}b</text>`;}
  const gw=iw/12,bw=gw*0.34;
  for(let i=0;i<12;i++){
    const x=L+gw*i+gw/2;
    const h1=ih*c.rev[i]/mx,h2=Math.max(0,ih*c.gop[i]/mx);

  <h3>Girdiler</h3>`+tb(['Alan','Anlamı','Varsayılan'],[['Yatırım tutarı','Satın alma + başlangıç harcaması (birim seçilebilir)','Sizin girişiniz'],['Gelir büyümesi','Yıllık gelir artışı','%5'],['Gider büyümesi','Yıllık gider artışı','%4'],['Vergi','NOI üzerinden','%0'],['İskonto oranı','NPV için','%10'],['Süre','Tablo kaç yıl','15'],['Çıkış kapitalizasyonu','Son yıl satış değeri; 0 ise satış yok','0'],['Olgunlaşma','Yıl 1-3 NOI çarpanı','%70 / %85 / %100']])+

  tb(['Yıl','Gelir','Gider + FF&amp;E','NOI','Kümülatif'],[1,2,3,5,8,9].map(t=>{const r=row(t);return [t,nf.format(r.rev),nf.format(r.cost),nf.format(r.noi),sf(r.cum)];}))+

  tb(['Çıktı','Değer'],[['İskontolu geri dönüş',a.dpay==null?'15 yılda yok (> 15 yıl)':yrmo(a.dpay)],['NPV (%10)',sf(a.npv)+' EUR'],['IRR',pp(a.irr)]])+

  <h3>Senaryolar</h3><ol><li>Vergi %25 ve çıkış kapitalizasyonu %8: geri dönüş ${b.pay.toFixed(2).replace('.',',')} yıl (${yrmo(b.pay)}), NPV ${sf(b.npv)} EUR, IRR ${pp(b.irr)}. Vergi süreyi uzatır; satış değeri NPV'yi pozitife taşır.</li>

  <p>Satın alma kararında "kaç yılda çıkarım?" sorusunu cevaplar. DCF'ten farkı, değer değil süre vermesidir.</p>`;}],
 ['dcf','DCF',v=>{const x=v.dcf1,y=v.dcf2,r1=x.rows[0],r10=x.rows[x.rows.length-1],S=v.sens;return `<p>Otelin bugünkü değerini (EV) gelecekteki nakit akışlarını iskonto ederek hesaplar. Geri dönüş "kaç yılda?" sorusunu, DCF "bugün ne kadar eder?" sorusunu cevaplar.</p>
  <h3>Girdiler</h3>`+tb(['Alan','Varsayılan'],[['Projeksiyon süresi','10 yıl'],['WACC (iskonto)','%12'],['Terminal büyüme (g)','%3'],['Vergi','%25'],['Terminal yöntemi','Gordon büyümesi veya çıkış kapitalizasyonu'],['Yıl ortası iskontosu','Açık / kapalı'],['Net borç','0'],['Satın alma fiyatı','İsteğe bağlı']])+
  `<p>Her yılın serbest nakit akışı: FCF = NOI − vergi − işletme sermayesi değişimi − ek capex (renovasyon bağlıysa etkisi dahil).</p>
  <h3>Örnek (varsayılan, Gordon)</h3>`+
  tb(['Yıl','NOI','Vergi','FCF','İskonto çarpanı','Bugünkü değer'],[[1,nf.format(r1.noi),nf.format(r1.tax),nf.format(r1.fcf),r1.df.toFixed(3).replace('.',','),nf.format(r1.pv)],[10,nf.format(r10.noi),nf.format(r10.tax),nf.format(r10.fcf),r10.df.toFixed(3).replace('.',','),nf.format(r10.pv)]])+
  tb(['Sonuç','Değer'],[['FCF\'lerin bugünkü değeri toplamı',nf.format(x.sumPV)+' EUR'],['Terminal değer',nf.format(r10.fcf)+' × 1,03 ÷ 0,09 = '+nf.format(x.tv)+' EUR'],['Terminal değerin bugünkü değeri',nf.format(x.pvTV)+' EUR'],['<b>Kurumsal değer (EV)</b>','<b>'+nf.format(x.ev)+' EUR</b>'],['Terminal değer payı',pp(x.tvShare)],['EV / NOI',nf2.format(x.evNoi)+'x'],['EV / oda',nf.format(x.perRoom)+' EUR']])+
  `<p>Kurumsal değer 8.000.000 EUR fiyatın altında kalıyor: %12 WACC'ta fiyat pahalı.</p>
  <h3>Çıkış kapitalizasyonu yöntemi</h3><p>Çıkış kap oranı %8, net borç 2.000.000 EUR, satın alma fiyatı 8.000.000 EUR: terminal değer ${nf.format(y.tv)}, bugünkü değeri ${nf.format(y.pvTV)} (pay ${pp(y.tvShare)}), EV ${nf.format(y.ev)} EUR (${nf2.format(y.evNoi)}x NOI). Özkaynak değeri ${nf.format(y.eq)} EUR; "değer − fiyat" ${sf(y.eq+2000000-8000000)} EUR. Fiyat değerin altında, alım cazip görünür.</p>
  <h3>Duyarlılık tablosu (Gordon, EV, EUR)</h3>`+
  tb(['WACC \\ g'].concat(S.col.map(c=>'%'+String(+c.toFixed(1)).replace('.',','))),S.ws.map((w,i)=>['%'+Math.round(w)].concat(S.rows[i].map(nf.format))))+
  `<p>WACC'ı 2 puan düşürmek değeri ${nf.format(S.rows[2][2])}'dan ${nf.format(S.rows[0][2])} EUR'ya taşır; DCF en çok WACC'a duyarlıdır. Renovasyonu bağlarsanız EV ${nf.format(v.dcf3.ev)} EUR'ya düşer (${sf(v.dcf3.ev-x.ev)}).</p>`;}],
 ['capex','Renovasyon',v=>{const x=v.cx,i=x.init;return `<p>Otel tipine göre yenileme (capex) bütçesi oluşturur, kapalı kalma kaybını ve fiyat artışı getirisini hesaplar, 15 yıllık capex takvimini çıkarır.</p>
  <h3>Girdiler</h3>`+tb(['Alan','Anlamı','Varsayılan'],[['Otel profili','Ekonomi, orta, upscale, üst-üst/butik, lüks','Seçilir'],['Kapsam','Soft goods veya tam renovasyon','Seçilir'],['Oda oranı','Yenilenen oda yüzdesi','%100'],['Güncelleme çarpanı','2021 fiyatını bugüne taşır','1,15'],['Nakliye / vergi / kâr payı','Mal bedeline eklenir','%15'],['Tasarım ve yönetim ücretleri','','%10'],['Beklenmeyen','','%12'],['Ortak alanlar','Oda maliyetine oranla','%20'],['MEP','Anahtar başı USD, varsayılan kapalı','8.000 USD'],['Yenileme döngüsü','Soft / tam','6 / 12 yıl'],['Kapalı kalma','Soft / tam','5 / 21 gün'],['Kaybedilen NOI akışı','Kayıp gelirin NOI\'ye yansıması','%60'],['ADR artışı / akış','Yenileme sonrası','%6 / %80'],['Capex enflasyonu','','%4'],['İskonto / süre','','%12 / 15 yıl']])+
  `<p>Oda başı referanslar HVS Hotel Cost Estimating Guide 2021'den USD cinsindendir (Kaynaklar'a bakın). Türkiye'ye özgü kaynak bulunmadığı için "Yerel maliyet çarpanı" alanı vardır; yerel teklifinize göre ayarlayın.</p>
  <h3>Örnek: 29 odalı butik otel, tam kapsam</h3>`+
  tb(['Kalem','EUR'],[['Soft goods (anahtar başı)',nf2.format(x.sK)],['Tam renovasyon eki (anahtar başı)',nf2.format(x.fK)],['Mal bedeli toplamı',nf.format(i.hard)],['Nakliye / vergi / kâr payı (%15)',nf.format(i.fr)],['Ücretler (%10)',nf.format(i.fee)],['Beklenmeyen (%12)',nf.format(i.cn)],['<b>Toplam yatırım</b>','<b>'+nf.format(i.total)+'</b> (oda başı '+nf.format(x.perKey)+')']])+
  `<h3>Etkiler</h3><ul><li><b>Kapalı kalma kaybı:</b> ${nf.format(x.lost[0])} EUR (29 oda × 21 gün × TRevPAR × %60).</li><li><b>Fiyat artışı getirisi (ilk yıl):</b> ${nf.format(x.upStab)} EUR.</li><li><b>ROI:</b> ${pp(x.roi)}; ${x.pay==null?'15 yılda geri dönüş yok':'geri dönüş '+yrmo(x.pay)}; NPV (%12) ${sf(x.npv)} EUR.</li><li><b>15 yıllık toplam capex:</b> ${nf.format(x.total)} EUR.</li></ul>`+
  tb(['Yıl','Capex','Kayıp','Artış','Net','Kümülatif'],v.cpxRows.map(r=>[r.t,nf.format(r.capex),nf.format(r.lost),nf.format(r.up),sf(r.net),sf(r.cum)]))+
  `<p>Bu otelde ADR artışı varsayımı (%6) yenileme maliyetini karşılamıyor. Getiriyi pozitife çevirmek için kapsamı soft goods'a düşürün ya da ADR artışını gerçekçi bir hedefe göre ayarlayın.</p>
  <h3>Diğer sekmelerle bağlantı</h3><p>Renovasyon sekmesindeki "Geri dönüş ve DCF sekmelerine ekle" kutusunu işaretlerseniz yenileme yatırımı, kaybı ve artışı iki sekmenin hesaplarına eklenir (Geri dönüş: yatırım ${nf.format(v.pb3.I0)} EUR; DCF: EV ${nf.format(v.dcf3.ev)} EUR).</p>`;}],
 ['optim','Optimizasyon: duyarlılık',v=>{const r=v.opt1,t=r.rows[0],g=v.opt2,M=OPT_METRICS.noi;return `<p>Optimizasyon sekmesi, hangi varsayımın sonucu en çok oynattığını gösterir. Her girdiyi tek tek %10 yukarı ve %10 aşağı çeker, geri kalanını sabit tutar, NOI veya seçtiğiniz ölçütün ne kadar değiştiğini ölçer. Sonuç bir tornado grafiğidir: en uzun çubuk en önemli kaldıraçtır. Sekmede dört modül vardır: Duyarlılık, Hedef arama, Capex portföyü ve Fiyat-doluluk.</p>
  <h3>Nasıl okunur</h3><ol><li>Sonuç ölçütünü seçin: NOI, GOP, DCF işletme değeri veya geri dönüş süresi. DCF ve geri dönüş, kendi sekmelerindeki varsayımları kullanır.</li><li>Değişim adımını seçin (±%5 ile ±%25). Adım büyüdükçe çubuklar uzar, sıralama genelde aynı kalır.</li><li>Gider ayrıntısını seçin: "Grup bazında" kalemleri gruplar halinde, "Kalem bazında" her kalemi ayrı oynatır (örneğin OTA komisyonunu ayrı görmek için).</li><li>Çubuk renkleri girdinin yönünü gösterir: gri, girdi azalırsa; yeşil, girdi artarsa. Gelirde artış sonucu yükseltir, giderde artış düşürür; bu yüzden gider çubukları ters taraftadır.</li></ol>
  <h3>Örnek case: ${M.n} ±%10</h3><p>Baz NOI ${nf.format(Math.round(r.base))} EUR. En çok oynatan kaldıraçlar:</p>`+
  tb(['Kaldıraç','Girdi −%10','Girdi +%10','Esneklik'],r.rows.slice(0,6).map(x=>[x.lv.name,sf(x.lo),sf(x.hi),(x.el>=0?'+':'−')+Math.abs(x.el).toFixed(2).replace('.',',')]))+
  `<p><b>Esneklik</b>, girdi %1 değişince sonucun yüzde kaç değiştiğidir. ADR'de ${(t.el).toFixed(2).replace('.',',')}: ADR %1 artarsa NOI yaklaşık %${(t.el).toFixed(2).replace('.',',')} artar. Eksi esneklik, girdi artınca sonuç düşer demektir (giderler).</p>
  <p><b>Doğrulama:</b> ADR'yi %10 artırınca oda geliri ${nf.format(Math.round(v.RR0))} EUR × %10 = ${nf.format(Math.round(v.RR0*0.1))} EUR artar. Bunun %15'i OTA komisyonuna, %4'ü FF&amp;E rezervine gider; kalan %81 NOI'ye yansır: ${nf.format(Math.round(v.RR0*0.1))} × 0,81 = ${nf.format(Math.round(v.RR0*0.081))} EUR. Tabloda ADR +%10 satırı ${sf(t.hi)} EUR, yani el hesabıyla aynı.</p>
  <h3>Dikkat edilecekler</h3><ul><li>Doluluk göreli değişir: %65 doluluk %10 artınca %71,5 olur, %100'ü geçmez.</li><li>Tornado her kaldıracı tek başına oynatır. Gerçekte ADR yükselirse doluluk düşebilir; bu etkileşimi 4. modül (fiyat-doluluk) ele alır.</li><li>Kur etkisi (TL giderlerin euro karşılığı) bu modülde yoktur; Girdiler sekmesinden kur değiştirerek bakabilirsiniz.</li><li>Sıralama bir öneri değildir: bir kaldıracın hassas olması, onu kolay değiştirebileceğiniz anlamına gelmez. Neye odaklanacağınızı seçerken ölçüt budur.</li></ul>`;}],
 ['hedef','Optimizasyon: hedef arama',v=>{const G=v.goal,a=v.goalA,o=v.goalO,A=v.goalAmt,M=OPT_METRICS.noi;return `<p>Duyarlılık "bu girdi oynarsa ne olur?" diye sorar. Hedef arama tersini sorar: <b>"NOI şu değer olsun, bunun için ne olmalı?"</b> Bir hedef değer girersiniz; uygulama her kaldıracı tek başına çevirip hedefe ulaşmak için gereken değeri bulur. Hedefin gerçekçi olup olmadığını görmenin en hızlı yoludur: yıllık NOI için ADR'de %17'lik artış makuldür, giderde %80'lik kesinti hayaldir.</p>
  <h3>Nasıl kullanılır</h3><ol><li>Optimizasyon sekmesinde "2 Hedef arama"yı seçin ve sonuç ölçütünü belirleyin (NOI, GOP, DCF değeri, geri dönüş). Başlangıç hedefi otomatik önerilir (şimdiki değerin %20 üstü, geri dönüşte %20 altı); kendi hedefinizi yazın.</li><li>Tabloda her kaldıraç için şimdiki ve gereken değer, değişim oranı ve durum görünür. Durum etiketi: <b>makul</b> ±%25 içinde, <b>zorlu</b> ±%50 içinde, <b>gerçekçi değil</b> daha fazlası. "Tek başına yetmez", kaldıraç tamamen sıfırlansa veya üçe katlansa bile hedefe ulaşılamadığı anlamına gelir; parantezde ulaşılabilen en iyi değer yazar.</li><li>"Seçilen çözüm" bölümünden bir kaldıraç seçin: çözümde gelir, GOP, NOI, doluluk ve ADR'nin nasıl değiştiğini görürsünüz. Çözüm projeye uygulanıp motor yeniden çalıştırılır ve hedefle karşılaştırılır (doğrulama satırı).</li></ol>
  <h3>Örnek case: NOI 900.000 EUR</h3><p>Şimdiki NOI ${nf.format(Math.round(G.base))} EUR, hedef 900.000 EUR (+%${((900000/G.base-1)*100).toFixed(1).replace('.',',')}). Tek başına ulaşan kaldıraçlar:</p>`+
  tb(['Kaldıraç','Şimdi','Gereken','Değişim'],G.rows.filter(x=>x.ok).map(x=>[x.lv.name,optFv(x.v0,x.lv.u),optFv(x.v1,x.lv.u),(x.d>=0?'+':'−')+'%'+Math.abs(x.d*100).toFixed(1).replace('.',',')]))+
  `<p>Yorum: ADR ${optFv(a.v0,a.lv.u)} → ${optFv(a.v1,a.lv.u)} (+%${(a.d*100).toFixed(1).replace('.',',')}) ya da doluluk ${optFv(o.v0,o.lv.u)} → ${optFv(o.v1,o.lv.u)} makul görünür. F&amp;B kirası, misafir sayısı ve pazarlama giderinde gereken değişim gerçekçi değildir. Tüm giderler ayrı ayrı sıfırlansa bile (personel, enerji, departman giderleri) tek başına hedefe yetmez: ${G.rows.filter(x=>!x.ok).length} kaldıraç "tek başına yetmez" çıkar.</p>
  <p><b>Doğrulama:</b> ADR ${optFv(a.v0,a.lv.u)} → ${optFv(a.v1,a.lv.u)} olunca toplam gelir ${nf.format(Math.round(sum(A.c0.rev)))} → ${nf.format(Math.round(sum(A.c1.rev)))} EUR (+${nf.format(Math.round(sum(A.c1.rev)-sum(A.c0.rev)))}). Bunun %81'i NOI'ye yansır (OTA komisyonu %15 ve FF&amp;E %4 düşülür): ${nf.format(Math.round(sum(A.c1.rev)-sum(A.c0.rev)))} × 0,81 = ${nf.format(Math.round((sum(A.c1.rev)-sum(A.c0.rev))*0.81))} EUR. ${nf.format(Math.round(G.base))} + ${nf.format(Math.round((sum(A.c1.rev)-sum(A.c0.rev))*0.81))} = ${nf.format(Math.round(sum(A.c1.noi)))} EUR, yani hedef.</p>
  <h3>Dikkat edilecekler</h3><ul><li>Her satır yalnız bir kaldıracı çevirir. Gerçek hayatta birkaçı birlikte oynar (biraz ADR, biraz gider); kombinasyonlar için Capex portföyü ve Fiyat-doluluk modüllerine bakın.</li><li>ADR yükselince doluluk düşebilir; bu etki burada yoktur, 4. modül (fiyat-doluluk) ele alır. ADR çözümü bu yüzden iyimser okunmalıdır.</li><li>Doluluk aylık olarak %100 ile sınırlıdır. Yıllık ortalama hedefi yüksekse, yüksek sezon ayları sınırı aşamadığı için gereken artış büyür.</li><li>Geri dönüş ölçütünde yatırım tutarı girilmiş olmalıdır; DCF ölçütü DCF sekmesindeki varsayımları kullanır.</li></ul>`;}],
 ['capexpf','Optimizasyon: capex portföyü',v=>{const I=v.pfI.items,dec=r=>I.map((it,i)=>r.choice[i]>=0?it.name+' (yıl '+r.choice[i]+')':null).filter(Boolean).join(', ')||'–',F=v.pfFull,x=v.pfx,tr=x.roomRev0*x.frac*0.10*x.upFlow;
 return `<p>Renovasyon sekmesi tek bir yenileme planını hesaplar. Bu modül daha çok kalem arasından <b>hangisinin, hangi yıl yapılacağını</b> seçer: soft goods mu tam renovasyon mu, ortak alan şimdi mi sonra mı, yıllık bütçe tavanı buna izin veriyor mu. Uygulama tüm seçim ve yıl kombinasyonlarını dener, tavanı aşanları eler ve net bugünkü değeri (NPV) en yüksek olanı bulur.</p>
  <h3>Nasıl kullanılır</h3><ol><li>Optimizasyon sekmesinde "3 Capex portföyü"nü açın. Aday kalemler Renovasyon sekmesindeki referanslardan başlangıç değeri alır; her satırı kendi teklifinize göre değiştirin: maliyet, kapalı kalma günü, ADR artışı, etkinin kaç yıl sürdüğü.</li><li><b>Grup:</b> aynı harfli kalemlerden en fazla biri seçilir (soft goods ile tam renovasyon aynı odalar için alternatiftir). <b>Zorunlu:</b> işaretli kalem mutlaka yapılır, "en geç yıl" içinde zamanı aranır.</li><li>Yıllık capex tavanı ve planlama ufku girin. Tavan 0 ise sınırsızdır.</li><li>Sonuçta önerilen portföy, yıllara göre takvim, geri dönüş ve iki karşılaştırma görünür: "isteğe bağlı yatırımların ek değeri" (yalnız zorunlu işlerle kıyas) ve "bütçe tavanının maliyeti" (tavansız optimumla kıyas).</li></ol>
  <h3>Örnek case: dört aday kalem</h3>`+
  tb(['Kalem','Maliyet (EUR)','Kapalı gün','ADR artışı','Etki süresi','Grup'],I.map(it=>[it.name+(it.must?' (zorunlu, en geç yıl '+it.by+')':''),sf(it.cost),String(it.days),'%'+String(it.up).replace('.',','),it.dur+' yıl',it.grp||'–']))+
  `<p class="hint">Bu tutarlar örnek içindir, referans değildir.</p>`+
  tb(['Senaryo','Seçim','Toplam capex','NPV'],[['Yalnız zorunlu',dec(v.pfMust),sf(v.pfMust.capTotal),sf(v.pfMust.npv)],['Tavan yok',dec(v.pfFree),sf(v.pfFree.capTotal),sf(v.pfFree.npv)],['Yıllık tavan 500.000',dec(v.pfC5),sf(v.pfC5.capTotal),sf(v.pfC5.npv)],['Yıllık tavan 400.000',dec(v.pfC4),sf(v.pfC4.capTotal),sf(v.pfC4.npv)]])+

 ['fiyatdoluluk','Optimizasyon: fiyat-doluluk',v=>{const R=v.pdR,mj=R.mons[0],mh=R.mons[5],mc=v.pdVc/(1-v.pdT),e=PD_DEF.eps,pstar=mc*e/(1+e),sg=m=>(m>=0?'+':'−')+'%'+Math.abs(m*100).toFixed(1).replace('.',',');
 return `<p>Önceki modüller bir girdiyi tek başına oynatır. Gerçekte fiyat yükselince doluluk düşer, fiyat düşünce artar. Bu modül o ilişkiyi <b>fiyat esnekliği</b> (ε) ile kurar ve her ay için en yüksek NOI'yi (veya GOP, gelir) veren fiyatı ve beklenen doluluğu arar.</p>

  <h3>Örnek case: NOI, ε = −1,2, ±%25</h3>`+
  tb(['Ay','ADR şimdi','ADR önerilen','Doluluk şimdi','Doluluk beklenen','Fiyat','Δ NOI'],[mj,mh].map(m=>[MONTHS[m.i],nf2.format(m.adr0),nf2.format(m.adr),nf2.format(m.occ0)+' %',nf2.format(m.occ)+' %',sg(m.m-1),sf(m.v-m.v0)+(m.edge?' ('+m.edge+' sınırda)':'')]))+
  `<p>Yıllık NOI ${sf(R.total)} EUR (şimdi ${sf(R.total0)}), artış ${sf(R.total-R.total0)} EUR. Düşük sezon ayları üst sınıra (+%25) dayanır: bu aylarda en iyi fiyat (aşağıdaki kapalı formüle göre yaklaşık ${nf.format(pstar)} EUR) mevcut ${nf.format(mj.adr0)} EUR'nun çok üstündedir, arama aralığın ucunda durur. Yaz aylarında en iyi fiyat zaten mevcut fiyata yakındır (${nf2.format(mh.adr)} EUR). Eğri tepe çevresinde düzdür: fiyatı en iyi değerden biraz saptırmak çok az kaybettirir.</p>
  <p><b>Doğrulama:</b> sabit esneklikli talepte en iyi fiyat kapalı bir formülle bulunur: <b>fiyat* = marjinal maliyet × ε ÷ (1 + ε)</b>. Satılan oda başına değişken gider ${nf2.format(v.pdVc)} EUR (misafir başına giderlerin toplamı × oda başına misafir). Gelirden OTA %${Math.round((v.pdT-0.04)*100)} ve FF&amp;E %4 düşülür; marjinal maliyet = ${nf2.format(v.pdVc)} ÷ ${nf2.format(1-v.pdT)} = ${nf2.format(mc)} EUR. Fiyat* = ${nf2.format(mc)} × (−1,2) ÷ (−0,2) = <b>${nf2.format(pstar)} EUR</b>. Uygulama Haziran için ${nf2.format(mh.adr)} EUR buldu (%1'lik adımlarla arar, ${nf2.format(mh.adr0)} × 1,04). Formül ve arama aynı yere çıkar.</p>

/* ---------- Sekme: Optimizasyon. Modül 1: Duyarlılık (tornado). Motora dokunmaz, compute/dcfCalc/pbCalc çıktısını okur ---------- */
const OPT_METRICS={
  noi:{n:'NOI (FF&E sonrası)',get:p=>sum(compute(p).noi),fm:v=>fmt(v),fd:v=>optS(v),u:()=>CUR()+', yıllık'},
  gop:{n:'GOP',get:p=>sum(compute(p).gop),fm:v=>fmt(v),fd:v=>optS(v),u:()=>CUR()+', yıllık'},
  ev:{n:'İşletme değeri (DCF EV)',get:p=>{const x=dcfCalc(p);return x.ev;},fm:v=>fmt(v),fd:v=>optS(v),u:()=>CUR()+', DCF sekmesi varsayımlarıyla'},
  pay:{n:'Geri dönüş süresi',get:p=>{const x=pbCalc(p);return x.I0>0?(x.pay===null?x.N:x.pay):null;},fm:v=>n2y(v),fd:v=>(v>0?'+':v<0?'−':'')+nf2.format(Math.abs(v))+' yıl',u:()=>'yıl, Geri dönüş sekmesi varsayımlarıyla'}
};
const n2y=v=>{const m=Math.round(v*12);return Math.floor(m/12)+' yıl '+(m%12)+' ay';};
const optS=v=>{const r=Math.round(v);return (r>0?'+':r<0?'−':'')+nf.format(Math.abs(r));};
const optP=v=>(v>0?'+':v<0?'−':'')+'%'+Math.abs(v*100).toFixed(1).replace('.',',');
const OPT_DEF={metric:'noi',step:10,detail:'group'};
function optOf(){if(!S.opt)S.opt=Object.assign({},OPT_DEF);return S.opt;}
/* Kaldıraçlar: her biri, proje kopyasında bir girdi grubunu f katsayısıyla çarpar */
function optLevers(p,detail){
  const c=compute(p),L=[];
  const ln=l=>sum(c.line[l.id]||[]);
  L.push({id:'occ',name:'Doluluk (tüm aylar)',hint:'göreli değişim: %65 doluluk, %10 artışta %71,5 olur. %100 ile sınırlı.',ap:(q,f)=>{q.occ=q.occ.map(v=>Math.min(100,v*f));}});
  L.push({id:'adr',name:'ADR (tüm aylar)',hint:'tüm aylarda ortalama oda fiyatı',ap:(q,f)=>{q.adr=q.adr.map(v=>v*f);}});
  if(p.guests>0)L.push({id:'guests',name:'Oda başına misafir',hint:'kişi başı gelir ve giderleri etkiler',ap:(q,f)=>{q.guests*=f;}});
  if(p.ffe>0)L.push({id:'ffe',name:'FF&E rezerv oranı',hint:'gelirin yüzdesi olarak ayrılan rezerv',ap:(q,f)=>{q.ffe*=f;}});
  const scale=ids=>(q,f)=>{q.lines.forEach(l=>{if(ids.has(l.id)){l.value=(+l.value||0)*f;if(l.monthly)l.monthly=l.monthly.map(v=>(+v||0)*f);}});};
  const lines=p.lines.filter(l=>l.driver!=='roomrev');
  if(detail==='line'){
    lines.forEach(l=>{if(Math.abs(ln(l))>1e-9)L.push({id:'l:'+l.id,name:gname(l.group)+': '+l.name,hint:'tek kalemin katsayısı veya tutarı',ap:scale(new Set([l.id]))});});
  }else{
    const st=lines.filter(l=>l.staff);
    if(st.length&&sum(c.staff)>0)L.push({id:'staff',name:'Personel giderleri (tüm bölümler)',hint:'personel olarak işaretli tüm kalemler',ap:scale(new Set(st.map(l=>l.id)))});
    GROUPS.filter(g=>g.id!=='rev_room').forEach(g=>{
      const ls=lines.filter(l=>l.group===g.id&&!l.staff);
      if(ls.length&&ls.some(l=>Math.abs(ln(l))>1e-9))
        L.push({id:'g:'+g.id,name:g.name+(lines.some(l=>l.group===g.id&&l.staff)?' – personel hariç':''),hint:'gruptaki tüm kalemler',ap:scale(new Set(ls.map(l=>l.id)))});
    });
  }
  const idsOf=id=>id.startsWith('l:')?[id.slice(2)]:id==='staff'?lines.filter(l=>l.staff).map(l=>l.id):id.startsWith('g:')?lines.filter(l=>l.group===id.slice(2)&&!l.staff).map(l=>l.id):null;
  L.forEach(lv=>{
    if(lv.id==='occ')lv.val=q=>{const k=compute(q);return sum(k.sold)/sum(k.avail)*100;},lv.u='%';
    else if(lv.id==='adr')lv.val=q=>{const k=compute(q);return sum(k.roomRev)/(sum(k.sold)||1);},lv.u=CUR();
    else if(lv.id==='guests')lv.val=q=>q.guests,lv.u='';
    else if(lv.id==='ffe')lv.val=q=>q.ffe,lv.u='%';
    else{const ids=idsOf(lv.id)||[];lv.val=q=>{const k=compute(q);return sum(ids.map(i=>sum(k.line[i]||[])));};lv.u=CUR()+'/yıl';}
  });
  return L;
}
function optSens(p,metric,step,detail){
  const M=OPT_METRICS[metric],s=step/100,base=M.get(p);
  if(base===null||base===undefined||!isFinite(base))return {base:null,rows:[]};
  const rows=[];
  optLevers(p,detail).forEach(lv=>{
    const run=f=>{const q=pclone(p);lv.ap(q,f);return M.get(q);};
    const lo=run(1-s),hi=run(1+s);
    if(lo===null||hi===null||!isFinite(lo)||!isFinite(hi))return;
    const dl=lo-base,dh=hi-base;
    if(Math.abs(dl)<1e-6&&Math.abs(dh)<1e-6)return;
    rows.push({lv,lo:dl,hi:dh,swing:Math.abs(dh-dl),el:base?((dh-dl)/(2*s))/Math.abs(base):0});
  });
  rows.sort((a,b)=>b.swing-a.swing);
  return {base,rows,step,metric};
}
function optChart(r,M){
  const mx=Math.max(1e-9,...r.rows.map(x=>Math.max(Math.abs(x.lo),Math.abs(x.hi))));
  const W=32,bar=(d,cls,lab)=>{const w=Math.abs(d)/mx*W,side=d<0?'l':'r';

function optSolve(p,lv,metric,T){
  const M=OPT_METRICS[metric];
  const g=f=>{const q=pclone(p);lv.ap(q,f);const v=M.get(q);return v===null||v===undefined||!isFinite(v)?NaN:v;};
  const fs=[],vs=[];for(let i=0;i<=60;i++){const f=i*0.05;const v=g(f);if(!isNaN(v)){fs.push(f);vs.push(v);}}
  let best=null;
  for(let i=0;i<fs.length-1;i++){
    const a=vs[i]-T,b=vs[i+1]-T;
    if(a===0||a*b<0||b===0){const mid=(fs[i]+fs[i+1])/2,d=Math.abs(mid-1);if(!best||d<best.d)best={i,d};}
  }
  if(!best){const mx=Math.max(...vs),mn=Math.min(...vs);return {ok:false,max:mx,min:mn};}
  let lo=fs[best.i],hi=fs[best.i+1],glo=vs[best.i]-T;
  for(let k=0;k<60;k++){const m=(lo+hi)/2,gm=g(m)-T;if(isNaN(gm))break;if(gm===0){lo=hi=m;break;}if((gm<0)===(glo<0)){lo=m;glo=gm;}else hi=m;}
  const f=(lo+hi)/2;return {ok:true,f,got:g(f)};
}
function optTargetOf(base,metric){
  const o=optOf(),M=OPT_METRICS[metric];
  const v=o.target!=null&&o.target!==''?parseFloat(String(o.target).replace(/\./g,'').replace(',','.')):NaN;
  if(isFinite(v)&&o.targetMetric===metric)return v;
  return metric==='pay'?Math.round(base*0.8*100)/100:Math.round(base*1.2);
}
function optSolveAll(p,metric,T){
  const levs=optLevers(p,optOf().detail),base=OPT_METRICS[metric].get(p);
  const rows=levs.map(lv=>{
    const r=optSolve(p,lv,metric,T),v0=lv.val(p);
    if(!r.ok)return {lv,ok:false,r,v0};
    const q=pclone(p);lv.ap(q,r.f);return {lv,ok:true,f:r.f,got:r.got,v0,v1:lv.val(q),d:r.f-1};
  });
  rows.sort((a,b)=>(a.ok===b.ok)?(a.ok?Math.abs(a.d)-Math.abs(b.d):0):(a.ok?-1:1));

}

/* ---------- Modül 3: Capex portföyü. Aday kalemler arasından, bütçe tavanı altında en yüksek net bugünkü değeri veren seçim ve yıl ---------- */
const PF_MAX=6;
function pfCtx(p){
  const cb=Object.assign({},CPX_DEF,p.cpx||{}),c=compute(p);
  const N=Math.max(2,Math.min(30,Math.round(pbN(cb.years))||15)),R=sum(c.rev),AV=sum(c.avail)||1;
  return {cb,N,trevpar:R/AV,roomRev0:sum(c.roomRev),frac:Math.max(0,Math.min(100,pbN(cb.roomsPct)))/100,rooms:p.rooms,
    ci:pbN(cb.capInfl)/100,gr:pbN(cb.gRev)/100,dr:pbN(cb.disc)/100,flow:pbN(cb.flow)/100,upFlow:pbN(cb.upFlow)/100};
}
function pfDefaults(p){
  const b=Object.assign({},CPX_DEF,p.cpx||{}),frac=Math.max(0,Math.min(100,pbN(b.roomsPct)))/100,rooms=p.rooms*frac;
  const upd=pbN(b.updF)||1,loc=pbN(b.local)||1;
  const sK=pbN(b.soft)*rateOf(p,b.softCur)*upd*loc,fK=pbN(b.full)*rateOf(p,b.fullCur)*upd*loc,mK=pbN(b.mep)*rateOf(p,b.mepCur)*loc;
  const frt=pbN(b.frt)/100,fe=pbN(b.fees)/100,ct=pbN(b.cont)/100;
  const tot=hard=>{const fr=hard*frt,fee=(hard+fr)*fe,cn=(hard+fr+fee)*ct;return hard+fr+fee+cn;};
  const R=v=>Math.round(v);
  return {cap:0,H:5,items:[
    {name:'Oda soft goods yenileme',cost:R(tot(rooms*sK)),days:pbN(b.daysSoft),up:R(pbN(b.adrUp)/2*10)/10,dur:Math.round(pbN(b.softCycle))||6,grp:'A',must:false,by:3,rooms:true},
    {name:'Oda tam renovasyon',cost:R(tot(rooms*(sK+fK))),days:pbN(b.daysFull),up:pbN(b.adrUp),dur:Math.round(pbN(b.fullCycle))||12,grp:'A',must:false,by:3,rooms:true},
    {name:'Ortak alan, lobi, F&B',cost:R(tot(rooms*(sK+fK)*pbN(b.pubPct)/100)),days:0,up:1.5,dur:10,grp:'',must:false,by:3,rooms:false},
    {name:'MEP / yapısal (HVAC, tesisat, asansör)',cost:R(tot(mK*p.rooms)),days:0,up:0,dur:10,grp:'',must:true,by:3,rooms:false}]};
}
const pfView=p=>p.cpxPf||pfDefaults(p);
const pfEdit=p=>{if(!p.cpxPf)p.cpxPf=pclone(pfDefaults(p));return p.cpxPf;};
function pfFlow(cx,it,y){
  const N=cx.N,cap=Array(N+1).fill(0),lost=Array(N+1).fill(0),up=Array(N+1).fill(0),net=Array(N+1).fill(0);
  const gf=t=>Math.pow(1+cx.gr,Math.max(t-1,0)),sc=it.rooms?cx.frac:1;
  cap[y]=pbN(it.cost)*Math.pow(1+cx.ci,y);
  lost[y]=cx.rooms*sc*pbN(it.days)*cx.trevpar*cx.flow*gf(y);
  const d=Math.max(1,Math.round(pbN(it.dur))||1);
  for(let t=y+1;t<=Math.min(N,y+d);t++)up[t]=cx.roomRev0*sc*pbN(it.up)/100*cx.upFlow*gf(t);
  let npv=0;for(let t=0;t<=N;t++){net[t]=up[t]-lost[t]-cap[t];npv+=net[t]/Math.pow(1+cx.dr,t);}
  return {cap,lost,up,net,npv};
}
function pfSolve(pf,cx,o){
  o=o||{};const items=pf.items,n=items.length,H=Math.min(cx.N-1,Math.max(0,Math.round(pbN(pf.H))));
  const lim=o.noCap?0:pbN(pf.cap);
  const fl=items.map(it=>{const a=[];for(let y=0;y<=H;y++)a.push(pfFlow(cx,it,y));return a;});
  const used={},yr=Array(cx.N+1).fill(0),choice=Array(n).fill(-1);let best=null;
  (function dfs(i,npv){
    if(i===n){if(!best||npv>best.npv+1e-9)best={npv,choice:choice.slice()};return;}
    const it=items[i],must=!!it.must,by=Math.min(H,Math.max(0,Math.round(pbN(it.by))));
    if(!must){choice[i]=-1;dfs(i+1,npv);}
    if(!must&&o.mustOnly)return;
    if(it.grp&&used[it.grp])return;
    for(let y=0;y<=(must?by:H);y++){
      const f=fl[i][y];
      if(lim>0&&yr[y]+f.cap[y]>lim+1e-6)continue;
      yr[y]+=f.cap[y];if(it.grp)used[it.grp]=true;choice[i]=y;
      dfs(i+1,npv+f.npv);
      yr[y]-=f.cap[y];if(it.grp)used[it.grp]=false;choice[i]=-1;
    }
  })(0,0);
  if(!best)return {infeasible:true};
  const N=cx.N,tot={cap:Array(N+1).fill(0),lost:Array(N+1).fill(0),up:Array(N+1).fill(0),net:Array(N+1).fill(0)};
  best.choice.forEach((y,i)=>{if(y>=0){const f=fl[i][y];['cap','lost','up','net'].forEach(k=>f[k].forEach((v,t)=>tot[k][t]+=v));}});
  let cum=0,pay=null;const rows=[];
  for(let t=0;t<=N;t++){const prev=cum;cum+=tot.net[t];if(pay===null&&t>0&&cum>=0&&tot.net[t]>0&&prev<0)pay=(t-1)+(-prev)/tot.net[t];rows.push({t,cap:tot.cap[t],lost:tot.lost[t],up:tot.up[t],net:tot.net[t],cum});}
  return {npv:best.npv,choice:best.choice,fl,H,tot,rows,pay,capTotal:sum(tot.cap),N};
}
function pfOut(){
  const p=P(),pf=pfView(p),cx=pfCtx(p),cu=CUR(),n=pf.items.length;
  if(!n)return '<div class="panel"><p class="hint">Aday kalem yok. "+ Kalem" ile ekleyin.</p></div>';
  const R=pfSolve(pf,cx);
  if(R.infeasible)return '<div class="panel"><h2>Sonuç</h2><p class="hint">Bütçe tavanı altında zorunlu kalemler sığmıyor. Tavanı yükseltin, zorunlu kalemin "en geç yıl" değerini artırın veya maliyeti kontrol edin.</p></div>';
  const base=pfSolve(pf,cx,{mustOnly:true}),free=pbN(pf.cap)>0?pfSolve(pf,cx,{noCap:true}):null;
  const card=(a,v,e)=>'<div class="kpi"><small>'+a+'</small><b>'+v+'</b><em>'+e+'</em></div>';
  const extra=base.infeasible?null:R.npv-base.npv;
  const rowsI=pf.items.map((it,i)=>{const y=R.choice[i],f=y>=0?R.fl[i][y]:null;
    return '<tr'+(y<0?' class="mut"':'')+'><td>'+esc(it.name)+(it.must?' <span class="ow">zorunlu</span>':'')+'</td><td>'+(y>=0?'Yıl '+y:'yapma')+'</td><td class="n">'+(f?fmt(-sum(f.cap)):'–')+'</td><td class="n">'+(f?fmt(-sum(f.lost)):'–')+'</td><td class="n">'+(f?fmt(sum(f.up)):'–')+'</td><td class="n">'+(f?fmt(f.npv):'–')+'</td></tr>';}).join('');
  const lim=pbN(pf.cap);
  const rowsY=R.rows.filter(r=>r.cap>0||r.up>0||r.lost>0).map(r=>{

  return '<div class="kpis">'+
    card('Optimum net bugünkü değer',fmt(R.npv),cu+', %'+pbN(cx.cb.disc)+' iskonto, '+R.N+' yıl')+
    card('Toplam capex',fmt(R.capTotal),'enflasyonlu, seçilen yıllarda')+

    card('İsteğe bağlı yatırımların ek değeri',extra===null?'–':fmt(extra),'yalnız zorunlu işlerin NPV\'si: '+(base.infeasible?'–':fmt(base.npv)))+
    (free?card('Bütçe tavanının maliyeti',fmt(free.npv-R.npv),'tavansız optimum '+fmt(free.npv)):card('Bütçe tavanı','yok','sınırsız')) +'</div>'+
    '<div class="panel"><h2>Önerilen portföy</h2><div class="scroll"><table class="pbt otab"><thead><tr><th>Kalem</th><th>Karar</th><th class="n">Capex</th><th class="n">Kayıp gelir</th><th class="n">Artan gelir</th><th class="n">NPV katkısı</th></tr></thead><tbody>'+rowsI+'</tbody></table></div>'+
    '<p class="hint">NPV katkısı: kalemin kendi nakit akışının bugünkü değeri (artan gelir − kayıp gelir − capex). Artan gelir yalnız etki süresi boyunca sürer, süre bitince yenileme bu modülde yoktur.</p></div>'+
    '<div class="panel"><h2>Kümülatif net etki (bin '+cu+')</h2><div class="legend"><span><i style="background:var(--bad)"></i>Geri dönmemiş</span><span><i style="background:var(--good)"></i>Geri dönmüş</span></div>'+cpxChart({rows:R.rows})+'</div>'+
    '<div class="panel"><h2>Yıllara göre takvim ('+cu+')</h2><div class="scroll"><table class="pbt"><thead><tr><th>Dönem</th><th>Yapılan</th><th class="n">Capex</th><th class="n">Tavan kullanımı</th><th class="n">Kayıp gelir</th><th class="n">Artan gelir</th><th class="n">Net</th><th class="n">Kümülatif</th></tr></thead><tbody>'+rowsY+'</tbody></table></div></div>';
}

/* ---------- Modül 4: Fiyat-doluluk. Sabit esneklikli talep: doluluk = doluluk0 × (fiyat / fiyat0)^ε, %100 ile sınırlı. Ay ay en iyi fiyat aranır ---------- */
const PD_DEF={eps:-1.2,bound:25,minOcc:0,obj:'noi',mon:[]};
const PD_OBJ={noi:{n:'NOI (FF&E sonrası)',get:c=>c.noi},gop:{n:'GOP',get:c=>c.gop},rev:{n:'Toplam gelir',get:c=>c.rev}};
const pdView=p=>Object.assign({},PD_DEF,p.pd||{});
const pdEdit=p=>{if(!p.pd)p.pd=pclone(PD_DEF);return p.pd;};
function pdEps(pd,i,ov){if(ov!=null)return ov;const m=pd.mon&&pd.mon[i];return pbN((m===undefined||m===null||m==='')?pd.eps:m);}
function pdSolve(p,pd,ov){
  for(let i=0;i<12;i++)if(pdEps(pd,i,ov)>=0)return {err:'Esneklik negatif olmalı (fiyat artınca doluluk düşer), örn. −1,2.'};
  const B=Math.max(1,Math.min(60,Math.round(pbN(pd.bound))||25)),O=PD_OBJ[pd.obj]||PD_OBJ.noi,minO=pbN(pd.minOcc);
  const grid=[];
  for(let k=-B;k<=B;k++){
    const m=1+k/100,q=pclone(p);q.adr=p.adr.map(a=>a*m);q.occ=p.occ.map((o,i)=>Math.min(100,o*Math.pow(m,pdEps(pd,i,ov))));
    grid.push({m,adr:q.adr,occ:q.occ,v:O.get(compute(q)).slice()});
  }
  const base=grid[B],mons=[];
  for(let i=0;i<12;i++){
    let best=B;
    for(let j=0;j<grid.length;j++){if(grid[j].occ[i]<minO-1e-9)continue;if(grid[j].v[i]>grid[best].v[i]+1e-9)best=j;}
    const g=grid[best];
    mons.push({i,m:g.m,adr:g.adr[i],occ:g.occ[i],v:g.v[i],adr0:p.adr[i],occ0:p.occ[i],v0:base.v[i],edge:best===0?'alt':best===grid.length-1?'üst':'',curve:grid.map(x=>x.v[i]),xs:grid.map(x=>x.adr[i]),best});
  }
  const q=pclone(p);q.adr=mons.map(m=>m.adr);q.occ=mons.map(m=>m.occ);
  const c0=compute(p),c1=compute(q);
  return {mons,total0:sum(mons.map(m=>m.v0)),total:sum(mons.map(m=>m.v)),c0,c1,q,B,obj:pd.obj,O};
}
function pdCurve(m,cu){
  const W=720,H=210,l=56,r=10,t=14,bt=30,xs=m.xs,ys=m.curve;
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),sp=(y1-y0)||1;
  const X=v=>l+(v-x0)/((x1-x0)||1)*(W-l-r),Y=v=>t+(y1-v)/sp*(H-t-bt);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Fiyata göre aylık sonuç">';
  for(let k=0;k<=3;k++){const v=y0+sp*k/3,y=Y(v);s+='<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(l-6)+'" y="'+(y+3)+'" text-anchor="end">'+nf.format(v/1000)+'</text>';}
  s+='<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="'+xs.map((x,i)=>X(x).toFixed(1)+','+Y(ys[i]).toFixed(1)).join(' ')+'"/>';
  const mk=(x,y,lab,c,dy)=>'<circle cx="'+X(x)+'" cy="'+Y(y)+'" r="4.5" fill="'+c+'"/><text x="'+(X(x)>W-60?X(x)+4:X(x))+'" y="'+(Y(y)+dy+(Y(y)<t+12&&dy<0?26:0))+'" text-anchor="'+(X(x)>W-60?'end':'middle')+'">'+lab+'</text>';
  s+=mk(m.adr0,m.v0,'şimdi','var(--muted)',16);
  if(Math.abs(m.adr-m.adr0)>1e-6)s+=mk(m.adr,m.v,'önerilen','var(--good)',-9);
  for(const k of [0,.5,1]){const x=x0+(x1-x0)*k;s+='<text x="'+X(x)+'" y="'+(H-8)+'" text-anchor="'+(k===0?'start':k===1?'end':'middle')+'">'+nf2.format(x)+'</text>';}
  return s+'</svg>';
}
function pdOut(){
  const p=P(),pd=pdView(p),o=optOf(),cu=CUR();
  const R=pdSolve(p,pd);
  if(R.err)return '<div class="panel"><h2>Sonuç</h2><p class="hint">'+R.err+'</p></div>';
  const M=R.O.n,mi=Math.max(0,Math.min(11,+o.pdMonth||0)),mo=R.mons[mi];

  const sens=[-0.6,-1,-1.5,-2,-3].map(e=>{const r=pdSolve(p,pd,e);const ms=r.mons.reduce((a,m)=>a+(m.m-1),0)/12;return '<tr><td>'+String(e).replace('.',',')+'</td><td class="n">'+optS(r.total-r.total0)+'</td><td class="n">'+sg(ms*100)+'</td><td class="n">'+r.mons.filter(m=>m.edge).length+'</td></tr>';}).join('');

    card('Satılan oda',nf.format(sold(R.c0))+' → '+nf.format(sold(R.c1)),'yıllık')+
    card('Fiyat sınırına dayanan ay',String(edge),'sınır genişletilirse sonuç daha da değişir')+'</div>'+
    '<div class="panel"><h2>Aylık en iyi fiyat ('+cu+')</h2><div class="scroll"><table class="pbt otab"><thead><tr><th>Ay</th><th class="n mh">ADR şimdi</th><th class="n mh">Doluluk % şimdi</th><th class="n">ADR önerilen</th><th class="n">Doluluk % beklenen</th><th class="n">Fiyat</th><th class="n">Δ '+esc(M)+'</th><th class="mh"></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="hint">Her ay bağımsız aranır: aylık sonuç yalnız o ayın fiyatına ve dolulumuna bağlıdır. Beklenen doluluk = mevcut doluluk × (yeni ADR ÷ mevcut ADR)<sup>esneklik</sup>, en çok %100. Doğrulama: seçilen fiyatlar projeye uygulanıp motor yeniden çalıştırıldı, yıllık '+esc(M)+' '+fmt(sum(R.O.get(R.c1)))+' çıktı, aylıkların toplamı '+fmt(R.total)+'.</p></div>'+
    '<div class="panel"><div class="rowh"><h2>Fiyat eğrisi: '+MONTHS[mi]+'</h2><div class="fld" style="min-width:160px"><select id="op-pdMonth" data-opt="pdMonth" aria-label="Ay">'+MONTHS.map((m,i)=>'<option value="'+i+'"'+(i===mi?' selected':'')+'>'+m+'</option>').join('')+'</select></div></div>'+
    pdCurve(mo,cu)+'<p class="hint">Eğri, '+MONTHS[mi]+' ayının '+esc(M)+' değerini fiyata göre gösterir ('+cu+', bin). Tepe noktası en iyi fiyattır; eğri tepede düzse küçük fiyat hatalarının maliyeti azdır.</p></div>'+
    '<div class="panel"><h2>Esnekliğe duyarlılık</h2><div class="scroll"><table class="pbt"><thead><tr><th>Esneklik ε</th><th class="n">Yıllık '+esc(M)+' artışı</th><th class="n">Ortalama fiyat değişimi</th><th class="n">Sınırdaki ay</th></tr></thead><tbody>'+sens+'</tbody></table></div>'+
    '<p class="hint">Aynı sınırlar ve hedefle, tüm aylar için tek bir esneklik denenir (aylık özel değerler yoksayılır). Esneklik −1\'e yaklaştıkça fiyat artışının getirisi azalır; çok esnek talepte (ε çok negatif) fiyat artırmak değil indirmek kazandırabilir.</p></div>';
}
function viewOpt4(){
  const p=P(),pd=pdView(p),o=optOf();
  const sel=(k,val,opts)=>'<select id="pd-'+k+'" data-pdsel="'+k+'">'+opts.map(a=>'<option value="'+a[0]+'"'+(String(val)===String(a[0])?' selected':'')+'>'+a[1]+'</option>').join('')+'</select>';
  const mon=MONTHS.map((m,i)=>'<div class="fld"><label for="pd-m'+i+'">'+m+'</label><input id="pd-m'+i+'" type="text" inputmode="decimal" data-pd="mon:'+i+'" placeholder="'+String(pd.eps).replace('.',',')+'" value="'+(pd.mon&&pd.mon[i]!=null&&pd.mon[i]!==''?esc(String(pd.mon[i]).replace('.',',')):'')+'"></div>').join('');
  return optSub()+'<div class="panel"><h2>Fiyat-doluluk optimizasyonu</h2>'+
   '<details open><summary>Ne işe yarar</summary><p class="hint" style="margin-top:6px">Fiyat yükselince doluluk düşer, fiyat düşünce artar. Önceki modüller bu etkileşimi görmezdi; burada talep, tek bir fiyat esnekliği ile modellenir: ADR %10 artarsa ve esneklik −1,2 ise doluluk yaklaşık %11 düşer. Uygulama her ay için en yüksek NOI (veya GOP, gelir) veren fiyatı ve beklenen doluluğunu bulur. Değişken maliyet (misafir başına gider, OTA komisyonu) varsa kâr en yüksek fiyat, gelir en yüksek fiyattan yüksektir; bu fark ekranda görünür.</p></details>'+
   '<div class="pbform" style="margin-top:12px">'+
   '<div class="fld"><label for="pd-obj">Hedef</label>'+sel('obj',pd.obj,Object.keys(PD_OBJ).map(k=>[k,PD_OBJ[k].n]))+'</div>'+

/* ---------- Geri dönüş (payback) modülü: motora dokunmaz, compute() çıktısını okur ---------- */
const PB_DEF={invest:0,capex:0,gRev:5,gCost:4,tax:0,disc:10,years:15,r1:70,r2:85,r3:100,exitCap:0};
function pbOf(p){if(!p.pb)p.pb=Object.assign({},PB_DEF);return p.pb;}
const pbN=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0;};
function pbCalc(p){
  const c=compute(p),b=pbOf(p);
  const R=sum(c.rev),NOI=sum(c.noi),COST=R-NOI;
  const rf=(p.cpx&&p.cpx.link)?cpxFlows(p,30):null;
  const I0=pbN(b.invest)*rateOf(p,b.investCur)+pbN(b.capex)*rateOf(p,b.capexCur)+(rf?rf.capex[0]+rf.lost[0]:0);
  const N=Math.max(1,Math.min(30,Math.round(pbN(b.years))||15));
  const gr=pbN(b.gRev)/100,gc=pbN(b.gCost)/100,tx=pbN(b.tax)/100,dr=pbN(b.disc)/100,cap=pbN(b.exitCap)/100;
  const ramp=[pbN(b.r1),pbN(b.r2),pbN(b.r3)].map(v=>v/100);
  const rows=[];let cum=-I0,dcum=-I0,pay=null,dpay=null;
  for(let t=1;t<=N;t++){
    const rp=t<=3?ramp[t-1]:1;
    const rev=R*rp*Math.pow(1+gr,t-1),cost=COST*rp*Math.pow(1+gc,t-1),noi=rev-cost;
    const up=rf?rf.up[t]:0,ls=rf?rf.lost[t]:0,cxr=rf?rf.capex[t]:0,reno=up-ls-cxr;
    const tax=Math.max(0,noi+up-ls)*tx,cf=noi-tax+reno,df=cf/Math.pow(1+dr,t);
    const pc=cum,pd=dcum;cum+=cf;dcum+=df;
    if(pay===null&&I0>0&&cum>=0&&cf>0)pay=(t-1)+(-pc)/cf;
    if(dpay===null&&I0>0&&dcum>=0&&df>0)dpay=(t-1)+(-pd)/df;
    rows.push({t,rev,cost,noi,tax,reno,cf,cum,dcum,pct:I0>0?(cum+I0)/I0:0});
  }
  const last=rows[rows.length-1];
  const exit=cap>0&&last?Math.max(0,last.noi*(1+gr))/cap:0;
  const flows=[-I0].concat(rows.map(r=>r.cf));
  if(exit)flows[flows.length-1]+=exit;
  const npv=r=>flows.reduce((s,v,i)=>s+v/Math.pow(1+r,i),0);
  let irr=null;
  if(I0>0){let lo=-0.9,hi=3;if(npv(lo)*npv(hi)<0){for(let k=0;k<80;k++){const m=(lo+hi)/2;if(npv(lo)*npv(m)<=0)hi=m;else lo=m;}irr=(lo+hi)/2;}}
  return {c,R,NOI,I0,N,rows,pay,dpay,exit,npv:npv(dr),irr,yoc:I0>0?NOI/I0:0,y1:I0>0&&rows[0]?rows[0].cf/I0:0,perRoom:p.rooms>0?I0/p.rooms:0};
}
const pbYr=(v,n)=>{if(v===null)return n?'> '+n+' yıl':'–';const y=Math.floor(v),m=Math.round((v-y)*12);return (y+(m===12?1:0))+' yıl '+(m===12?0:m)+' ay';};
function pbChart(x){
  const W=720,H=230,l=52,r=8,t=14,bt=26,n=x.rows.length;
  const vals=[-x.I0].concat(x.rows.map(r=>r.cum));
  const mx=Math.max(0,...vals),mn=Math.min(0,...vals),span=(mx-mn)||1;
  const Y=v=>t+(mx-v)/span*(H-t-bt),bw=(W-l-r)/(n+1);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Kümülatif nakit akışı">';
  const raw=span/4,pw=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(m=>m*pw).find(v=>v>=raw);for(let v=Math.ceil(mn/st)*st;v<=mx+st*1e-6;v+=st){const y=Y(v);s+='<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(l-6)+'" y="'+(y+3)+'" text-anchor="end">'+nf.format(v/1000)+'</text>';}
  vals.forEach((v,i)=>{const x0=l+i*bw+bw*.15,y0=Y(0),y1=Y(v);s+='<rect class="'+(v<0?'pbn':'pbp')+'" x="'+x0+'" width="'+(bw*.7)+'" y="'+Math.min(y0,y1)+'" height="'+Math.max(1,Math.abs(y1-y0))+'"/><text x="'+(x0+bw*.35)+'" y="'+(H-8)+'" text-anchor="middle">'+i+'</text>';});
  s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="currentColor" stroke-width="1" opacity=".5"/>';
  if(x.pay!==null){const px=l+(x.pay+.5)*bw;s+='<line x1="'+px+'" x2="'+px+'" y1="'+t+'" y2="'+(H-bt)+'" stroke="var(--accent)" stroke-dasharray="4 3"/><text x="'+px+'" y="'+(t+8)+'" text-anchor="'+(px>W-120?'end':'start')+'" style="fill:var(--accent)"> geri dönüş '+pbYr(x.pay)+' </text>';}
  return s+'</svg>';
}

/* ---------- DCF modülü: motora dokunmaz, compute() çıktısını okur ---------- */
const DCF_DEF={years:10,gRev:5,gCost:4,r1:70,r2:85,r3:100,tax:25,wacc:12,tg:3,method:'gordon',exitCap:8,mid:false,nwc:0,capexPct:0,netDebt:0,price:0};
function dcfOf(p){if(!p.dcf)p.dcf=Object.assign({},DCF_DEF);return p.dcf;}
function dcfCalc(p,ov){
  const b=Object.assign({},dcfOf(p),ov||{}),c=ov&&ov._c?ov._c:compute(p);
  const R=sum(c.rev),NOI0=sum(c.noi),COST=R-NOI0;
  const N=Math.max(2,Math.min(30,Math.round(pbN(b.years))||10));
  const gr=pbN(b.gRev)/100,gc=pbN(b.gCost)/100,tx=pbN(b.tax)/100,w=pbN(b.wacc)/100,g=pbN(b.tg)/100,cap=pbN(b.exitCap)/100;
  const nwc=pbN(b.nwc)/100,cx=pbN(b.capexPct)/100,mid=!!b.mid,ramp=[pbN(b.r1),pbN(b.r2),pbN(b.r3)].map(v=>v/100);
  const rf=(p.cpx&&p.cpx.link)?cpxFlows(p,30):null;
  const rows=[];let prev=null,sumPV=0;
  for(let t=1;t<=N;t++){
    const rp=t<=3?ramp[t-1]:1,rev=R*rp*Math.pow(1+gr,t-1),cost=COST*rp*Math.pow(1+gc,t-1),noi=rev-cost;
    const up=rf?rf.up[t]:0,ls=rf?rf.lost[t]:0,rc=rf?rf.capex[t]:0;
    const tax=Math.max(0,noi+up-ls)*tx,dn=prev===null?0:nwc*(rev-prev),capex=cx*rev+rc,fcf=noi-tax-dn-capex+up-ls;
    const te=t-(mid?0.5:0),df=1/Math.pow(1+w,te),pv=fcf*df;prev=rev;sumPV+=pv;
    rows.push({t,rev,cost,noi,tax,dn,capex,other:up-ls-dn-capex,fcf,df,pv});
  }
  const L=rows[rows.length-1],gordon=b.method!=='cap';
  let tv=null;
  if(gordon){if(w>g)tv=L.fcf*(1+g)/(w-g);}else if(cap>0){tv=L.noi*(1+g)/cap;}
  const tvT=(gordon&&mid)?N-0.5:N,pvTV=tv===null?null:tv/Math.pow(1+w,tvT);
  const c0=rf?rf.capex[0]+rf.lost[0]:0;
  const ev=pvTV===null?null:sumPV+pvTV-c0;
  const debt=pbN(b.netDebt)*rateOf(p,b.netDebtCur),price=pbN(b.price)*rateOf(p,b.priceCur);
  return {b,c,R,NOI0,N,rows,sumPV,tv,pvTV,c0,ev,debt,price,eq:ev===null?null:ev-debt,gordon,w,g,cap,
    tvShare:ev?pvTV/ev:null,evNoi:ev&&NOI0>0?ev/NOI0:null,perRoom:ev!==null&&p.rooms>0?ev/p.rooms:null,
    tvMult:tv&&L.noi>0?tv/L.noi:null,tvCap:tv&&gordon?L.noi*(1+g)/tv:null};
}
function dcfSens(p,x){
  const b=x.b,ws=[-2,-1,0,1,2].map(d=>x.w*100+d),cs=[-1,-.5,0,.5,1];
  const col=x.gordon?cs.map(d=>pbN(b.tg)+d):cs.map(d=>pbN(b.exitCap)+d);
  const rows=ws.map(wv=>col.map(cv=>{const ov=x.gordon?{wacc:wv,tg:cv}:{wacc:wv,exitCap:cv};ov._c=x.c;const r=dcfCalc(p,ov);return r.ev;}));
  return {ws,col,rows};
}
function dcfChart(x){
  const W=720,H=230,l=52,r=8,t=14,bt=26,n=x.rows.length+1;
  const vals=x.rows.map(r=>r.pv).concat([x.pvTV||0]),mx=Math.max(1,...vals),mn=Math.min(0,...vals),span=(mx-mn)||1;
  const Y=v=>t+(mx-v)/span*(H-t-bt),bw=(W-l-r)/n;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="İskontolanmış nakit akışları">';
  const raw=span/4,pw=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(m=>m*pw).find(v=>v>=raw);
  for(let v=Math.ceil(mn/st)*st;v<=mx+st*1e-6;v+=st){const y=Y(v);s+='<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(l-6)+'" y="'+(y+3)+'" text-anchor="end">'+nf.format(v/1000)+'</text>';}
  vals.forEach((v,i)=>{const x0=l+i*bw+bw*.15,y0=Y(0),y1=Y(v);s+='<rect class="'+(i===n-1?'dcft':'dcfb')+'" x="'+x0+'" width="'+(bw*.7)+'" y="'+Math.min(y0,y1)+'" height="'+Math.max(1,Math.abs(y1-y0))+'"/><text x="'+(x0+bw*.35)+'" y="'+(H-8)+'" text-anchor="middle">'+(i===n-1?'TV':i+1)+'</text>';});
  return s+'</svg>';
}
function dcfOut(){

    '</div>'+
    '<div class="panel"><h2>İskontolu nakit akışları (bin '+cu+')</h2><div class="legend"><span><i style="background:var(--accent)"></i>Yıllık FCF, bugünkü değer</span><span><i style="background:var(--good)"></i>Son değer, bugünkü değer</span></div>'+dcfChart(x)+

    (x.c0?'<tr><td>Yıl 0 renovasyon (capex + kayıp)</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td class="n neg">'+fmt(-x.c0)+'</td></tr>':'')+'<tr class="key"><td>İşletme değeri (EV)</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td class="n">'+fmt(x.ev)+'</td></tr></tbody></table></div></div>'+

/* ---------- Renovasyon / Capex modülü: motora dokunmaz ---------- */
/* Referans: HVS Hotel Cost Estimating Guide 2021 (ABD, USD, oda başına). s = soft goods yenileme, f = tam renovasyon eki. [min,maks] */
const CPX_REF={
 eco:{n:'Ekonomi / bütçe',tag:'1-2 yıldız',s:[2261,3277],f:[2187,2819]},
 mid:{n:'Orta sınıf',tag:'3 yıldız',s:[5207,7122],f:[4897,6342]},
 up:{n:'Üst sınıf',tag:'4 yıldız',s:[7239,9912],f:[9223,12125]},
 uu:{n:'Üst-üst sınıf / lifestyle-butik',tag:'4-5 yıldız, butik',s:[9182,12551],f:[14296,19811]},
 lux:{n:'Lüks / resort',tag:'5 yıldız',s:[15329,21054],f:[24283,32954]}};
const cpxMid=a=>Math.round((a[0]+a[1])/2);
const CPX_DEF={profile:'up',soft:cpxMid(CPX_REF.up.s),softCur:'USD',full:cpxMid(CPX_REF.up.f),fullCur:'USD',updF:1.15,local:1,
 scope:'full',roomsPct:100,pub:true,pubPct:20,mepOn:false,mep:8000,mepCur:'USD',frt:15,fees:10,cont:12,
 startYear:0,softCycle:6,fullCycle:12,capInfl:4,daysSoft:5,daysFull:21,flow:60,adrUp:6,upFlow:80,gRev:5,disc:12,years:15,link:false};
function cpxOf(p){if(!p.cpx)p.cpx=Object.assign({},CPX_DEF);return p.cpx;}
function cpxPlan(p,N){
  const b=cpxOf(p),c=compute(p);N=N||Math.max(2,Math.min(30,Math.round(pbN(b.years))||15));
  const R=sum(c.rev),AV=sum(c.avail)||1,trevpar=R/AV,roomRev0=sum(c.roomRev);
  const frac=Math.max(0,Math.min(100,pbN(b.roomsPct)))/100,rooms=p.rooms*frac;
  const upd=pbN(b.updF)||1,loc=pbN(b.local)||1;
  const sK=pbN(b.soft)*rateOf(p,b.softCur)*upd*loc,fK=pbN(b.full)*rateOf(p,b.fullCur)*upd*loc,mK=pbN(b.mep)*rateOf(p,b.mepCur)*loc;
  const frt=pbN(b.frt)/100,fe=pbN(b.fees)/100,ct=pbN(b.cont)/100,ci=pbN(b.capInfl)/100,gr=pbN(b.gRev)/100;
  const full=b.scope==='full',y0=Math.max(0,Math.min(5,Math.round(pbN(b.startYear))));
  const mk=(s,f,pub,mep)=>{const rs=rooms*s,rf=rooms*f,hard=rs+rf+pub+mep,fr=hard*frt,fee=(hard+fr)*fe,cn=(hard+fr+fee)*ct;return {rs,rf,pub,mep,hard,fr,fee,cn,total:hard+fr+fee+cn};};
  const roomsInit=rooms*(sK+(full?fK:0));
  const init=mk(sK,full?fK:0,b.pub?roomsInit*pbN(b.pubPct)/100:0,b.mepOn?mK*p.rooms:0);
  const ev=[],gf=t=>Math.pow(1+gr,Math.max(t-1,0)),rows=[];
  const cap=Array(N+1).fill(0),lost=Array(N+1).fill(0),up=Array(N+1).fill(0),lab=Array(N+1).fill('');
  const sc=Math.max(1,Math.round(pbN(b.softCycle))||6),fc=Math.max(1,Math.round(pbN(b.fullCycle))||12);
  for(let t=0;t<=N;t++){
    let kind=null;
    if(t===y0)kind='init';else if(t>y0){if(full&&(t-y0)%fc===0)kind='full';else if((t-y0)%sc===0)kind='soft';}
    if(kind){
      const m=kind==='init'?init:mk(sK,kind==='full'?fK:0,0,0),days=(kind==='soft'||(kind==='init'&&!full))?pbN(b.daysSoft):pbN(b.daysFull);
      cap[t]=m.total*Math.pow(1+ci,t);lost[t]=rooms*days*trevpar*pbN(b.flow)/100*gf(t);
      lab[t]=kind==='init'?(full?'İlk renovasyon (tam)':'İlk renovasyon (soft goods)'):kind==='full'?'Tam renovasyon':'Soft goods yenileme';
    }
    if(t>y0)up[t]=roomRev0*frac*pbN(b.adrUp)/100*pbN(b.upFlow)/100*gf(t);
  }
  const dr=pbN(b.disc)/100;let cum=0,dcum=0,pay=null;
  for(let t=0;t<=N;t++){const net=up[t]-lost[t]-cap[t],prev=cum;cum+=net;dcum+=net/Math.pow(1+dr,t);
    if(pay===null&&t>0&&cum>=0&&net>0&&prev<0)pay=(t-1)+(-prev)/net;
    rows.push({t,lab:lab[t],capex:cap[t],lost:lost[t],up:up[t],net,cum,dcum});}
  const upStab=up[Math.min(N,y0+1)]||0,initAll=cap[y0]+lost[y0];
  return {b,init,rooms,frac,sK,fK,mK,trevpar,rows,cap,lost,up,N,y0,full,
    npv:dcum,pay,upStab,roi:cap[y0]>0?upStab/cap[y0]:null,total:sum(cap),perKey:rooms>0?cap[y0]/rooms:0,initAll};
}
function cpxFlows(p,N){const x=cpxPlan(p,N);return {capex:x.cap,lost:x.lost,up:x.up};}
function cpxChart(x){
  const W=720,H=220,l=52,r=8,t=14,bt=26,n=x.rows.length;
  const vals=x.rows.map(r=>r.cum),mx=Math.max(0,...vals),mn=Math.min(0,...vals),span=(mx-mn)||1;
  const Y=v=>t+(mx-v)/span*(H-t-bt),bw=(W-l-r)/n;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Renovasyonun kümülatif net etkisi">';
  const raw=span/4,pw=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(m=>m*pw).find(v=>v>=raw);
  for(let v=Math.ceil(mn/st)*st;v<=mx+st*1e-6;v+=st){const y=Y(v);s+='<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(l-6)+'" y="'+(y+3)+'" text-anchor="end">'+nf.format(v/1000)+'</text>';}
  vals.forEach((v,i)=>{const x0=l+i*bw+bw*.15,y0=Y(0),y1=Y(v);s+='<rect class="'+(v<0?'pbn':'pbp')+'" x="'+x0+'" width="'+(bw*.7)+'" y="'+Math.min(y0,y1)+'" height="'+Math.max(1,Math.abs(y1-y0))+'"/><text x="'+(x0+bw*.35)+'" y="'+(H-8)+'" text-anchor="middle">'+i+'</text>';});
  return s+'</svg>';
}
function cpxOut(){

function getNode(id,x){
  if(!id)return null;
  if(ST[id])return ST[id];
  if(id.startsWith('line:'))return lineNode(id.slice(5),x);
  if(id.startsWith('grp:'))return grpNode(id.slice(4),x);
  if(id.startsWith('drv:'))return drvNode(id.slice(4),x);
  if(id.startsWith('btn:'))return btnNode(id.slice(4));
  return plainNode(id);
}
const asArr=(v,x)=>typeof v==='function'?v(x):(v||[]);
const insOf=(id,x)=>{const n=getNode(id,x);return n?asArr(n.ins,x):[];};
const outsOf=(id,x)=>{const n=getNode(id,x);return n?asArr(n.outs,x):[];};
function downstream(id,x){const lv=[];const seen=new Set([id]);let cur=[id];for(let i=0;i<9;i++){const nx=[];cur.forEach(n=>outsOf(n,x).forEach(o=>{if(!seen.has(o)&&getNode(o,x)){seen.add(o);nx.push(o);}}));if(!nx.length)break;lv.push(nx);cur=nx;}return lv;}
function ctx(){const p=P();return {p,c:compute(p),ms:L.m};}
function tuneOf(id,x){const n=getNode(id,x);if(!n)return null;if(n.tuneObj)return n.tuneObj;if(typeof n.tune==='function'){x.ms=L.m;return n.tune(x);}return null;}

const STRIP={rev:0,gop:1,ebitda:2,noi:3,occKPI:4,adrKPI:4};
const KPI_LBL={occKPI:'Doluluk',adrKPI:'ADR',revpar:'RevPAR',trevpar:'TRevPAR',goppar:'GOPPAR',noipar:'NOI / mevcut oda',staffpct:'Personel / gelir',gopm:'GOP marjı'};
const L0={'Toplam gelir':['rev'],'Departman giderleri':['dept'],'Departman kârı':['dp'],'Dağıtılmamış giderler':['und'],'GOP (brüt işletme kârı)':['gop'],'Franchise ve yönetim ücretleri':['fees','grp:fees'],'Sabit giderler öncesi gelir':['icfc'],'Sabit giderler':['fixed','grp:fixed'],'NOI (FF&E rezervi öncesi)':['ebitda'],'NOI (FF&E rezervi sonrası)':['noi']};
function plRows(){
  const p=P(),out=[];let top=null,grp=null;
  $a('table.pl tbody tr').forEach(tr=>{
    const lbl=tr.cells[0].textContent.replace('▸','').trim();
    const dm=/\bd(\d)\b/.exec(tr.className);const dep=dm?+dm[1]:0;
    let keys=[];
    if(dep===0){top=null;grp=null;keys=L0[lbl]||(lbl.indexOf('FF&E rezervi (')===0?['ffeAmt']:[]);top=keys[0]||null;
      if(top==='fees')grp='fees';if(top==='fixed')grp='fixed';}
    else if(dep===1&&(top==='rev'||top==='dept'||top==='und')){const g=GROUPS.find(g=>g.name===lbl);if(g){grp=g.id;keys=['grp:'+g.id];}}
    else if(dep===1&&top==='dp'){keys=['dp'];}
    else if(dep===1&&(top==='fees'||top==='fixed')){const l=p.lines.find(l=>l.group===grp&&l.name===lbl);if(l)keys=['line:'+l.id];}
    else if(dep>=2&&grp){const l=p.lines.find(l=>l.group===grp&&l.name===lbl);if(l)keys=['line:'+l.id];}
    out.push({tr,keys});
  });
  return out;
}
function elsFor(id,x){
  const tab=S.tab,m=x.ms;const q=s=>$a(s);
  if(/^(pb|dcf|cpx|cur):/.test(id))return q('[data-ln~="'+id+'"]');
  const st=STRIP[id]!=null?[$q('#strip').children[STRIP[id]]].filter(Boolean):[];
  let res=[];
  if(tab==='girdiler'){
    const mon=(pre,attr)=>m==null?q(attr?'[data-in^="'+pre+':"]':'[id^="g-'+pre+'-"]:not([id$="-t"])'):q(attr?'[data-in="'+pre+':'+m+'"]':'#g-'+pre+'-'+m);
    const map={rooms:()=>q('#f-rooms'),guests:()=>q('#f-guests'),ffe:()=>q('#f-ffe'),
      open:()=>mon('open',1),days:()=>mon('days',1),occ:()=>mon('occ',1),adr:()=>mon('adr',1),
      cap:()=>mon('cap').concat(m==null?q('#g-cap-t'):[]),sold:()=>mon('sold').concat(m==null?q('#g-sold-t'):[]),rrev:()=>mon('rrev').concat(m==null?q('#g-rrev-t'):[])};
    if(map[id])res=map[id]();
  }else if(tab==='kalemler'){
    const p=P();
    if(id.startsWith('line:'))res=q('#la-'+id.slice(5));
    else if(id.startsWith('grp:'))res=q('#gt-'+id.slice(4));
    else if(id.startsWith('drv:'))res=p.lines.filter(l=>l.driver===id.slice(4)&&!l.monthly).flatMap(l=>q('#la-'+l.id));
    else if(id==='rrev')res=p.lines.filter(l=>l.driver==='roomrev').flatMap(l=>q('#la-'+l.id));
  }else if(tab==='pl'){
    plRows().forEach(r=>{if(r.keys.includes(id))res.push(r.tr);});
  }else if(tab==='kpi'){
    if(KPI_LBL[id])res=q('.kpi').filter(k=>k.querySelector('small').textContent===KPI_LBL[id]);
  }
  return res.concat(st);
}

function clearHL(){L.hl.forEach(e=>{e.classList.remove('lh-in','lh-sel','lh-out');e.style.removeProperty('--lhd');});L.hl=[];}
function mark(els,cls,delay){els.forEach(e=>{if(!e)return;e.classList.add(cls);e.style.setProperty('--lhd',delay+'ms');L.hl.push(e);});}
function applyHL(animate){
  clearHL();if(!L.on||!L.id)return;
  const x=ctx(),id=L.id,n=getNode(id,x);if(!n)return;
  const k=animate?1:0;
  insOf(id,x).forEach(i=>mark(elsFor(i,x),'lh-in',0));
  mark(elsFor(id,x),'lh-sel',k*350);
  downstream(id,x).forEach((lv,i)=>lv.forEach(o=>mark(elsFor(o,x),'lh-out',k*(700+i*380))));
}
